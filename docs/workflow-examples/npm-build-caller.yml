# Example: Copy this to your repo as .github/workflows/npm-build.yml
# Configuration is read from .github/project.yml - no inputs needed!
name: npm Build

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Required for the GitHub merge queue: `build / conclusion` is a required
  # status check, and without this trigger the queue entry never receives it,
  # waits out check_response_timeout_minutes, and is dropped.
  merge_group:

permissions:
  contents: read
  pull-requests: read  # the reusable workflow's gate reads open PRs to skip redundant push builds

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-npm-build.yml@5aed9a45d80dc68ae3f21f2fb24a81e5ecbdd865 # v0.20.0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
