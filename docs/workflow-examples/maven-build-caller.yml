# Example: Copy this to your repo as .github/workflows/maven.yml
# Configuration is read from .github/project.yml - no inputs needed!
# Path filtering is handled inside the reusable workflow via project.yml settings.
name: Maven Build

# Branches are built by their pull_request run (Sonar pull-request analysis); a push
# builds only main, plus release/* and dependabot/** (skipped there when an open PR
# already covers the commit). Feature, fix and chore branches are deliberately not in
# the push list: a first push has no PR yet, so a push build would run beside the PR
# build. A PR into a maintenance branch is built by its pull_request run only if
# that trigger matches the base, hence `release/*` in both lists.
# To also build every push, add the branch patterns back and set
# `ci.push-builds: deduplicated` in .github/project.yml. No caller `if:` is needed.
# The gate reads open PRs, hence `pull-requests: read` below.
on:
  push:
    branches: [main, "release/*", "dependabot/**"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:
  # Required when the repo uses a GitHub merge queue: without it the queued
  # checks never report and the queue times out. Inert for repos without one.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  actions: read       # conclusion job verifies a covering run exists (see Release Guard / #243)

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@711571432df351d3c5b08d5d50cb6c331f61abb1 # v0.42.0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
