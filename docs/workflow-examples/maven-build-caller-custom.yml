# Example: Maven build with custom options passed as explicit inputs
name: Maven Build

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Required when the repo uses a GitHub merge queue: without it the queued
  # checks never report and the queue times out. Inert for repos without one.
  merge_group:

permissions:
  contents: read
  pull-requests: read  # the reusable workflow's gate reads open PRs to skip redundant push builds
  actions: read       # conclusion job verifies a covering run exists (see Release Guard / #243)

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@b2de4107d3d53a41a7edab7e2513887c309b8237 # v0.36.0
    with:
      # Explicit inputs apply where .github/project.yml does not set the same key;
      # project.yml wins wherever it does (resolved centrally by read-project-config)
      java-versions: '["21","25"]'
      enable-sonar: true
      enable-snapshot-deploy: true
      npm-cache: true  # Enable for projects with frontend
      maven-profiles-snapshot: 'release-snapshot,javadoc'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
