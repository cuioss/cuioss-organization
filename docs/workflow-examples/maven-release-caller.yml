# Example: Copy this to your repo as .github/workflows/release.yml
# Configuration is read from .github/project.yml - no inputs needed!
#
# The pull_request trigger below fires on ANY merged edit to project.yml, which
# also carries maven-build, sonar, pages and more. The reusable workflow's own
# guard job is what narrows that to an actual release: it is a no-op unless
# release.current-version changed on the merge and is not already tagged.
# See "Release Guard" in docs/Workflows.adoc.
name: Release

on:
  pull_request:
    types: [closed]
    paths:
      - '.github/project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-release.yml@47273b80f2d215fd277883956000407eb708db15 # v0.39.0
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # Only when project.yml lists a consumer in another organisation
      # (`plan-marshall/<repo>`): that organisation's own release App, stored in cuioss as
      # RELEASE_APP_ID_<OWNER> / RELEASE_APP_PRIVATE_KEY_<OWNER>. Without them, propagation
      # to that owner's consumers fails by name; the cuioss App is never used instead.
      # RELEASE_APP_ID_PLAN_MARSHALL: ${{ secrets.RELEASE_APP_ID_PLAN_MARSHALL }}
      # RELEASE_APP_PRIVATE_KEY_PLAN_MARSHALL: ${{ secrets.RELEASE_APP_PRIVATE_KEY_PLAN_MARSHALL }}
