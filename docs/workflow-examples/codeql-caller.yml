# Example: Copy this to your repo as .github/workflows/codeql.yml
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-codeql.yml@bf0f1305123c16521d9fdcf2a9474e3cdb981caa # v0.37.0
    # A called workflow can only restrict the caller's token, never escalate it.
    # security-events: write is what lets CodeQL upload its SARIF results; without
    # it GitHub rejects the run with a startup failure before any job executes.
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      languages: '["java"]'
      # build-mode: none skips building the project during scanning. Use autobuild
      # (or leave unset) where the analysis needs compiled sources.
      build-mode: none
