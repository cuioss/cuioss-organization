# Example: Pyprojectx verification workflow
# Copy this file to .github/workflows/python-verify.yml in your repository

name: Python Verify

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "dependabot/**"]
  pull_request:
    branches: [main]
  # Required for the GitHub merge queue: `verify / conclusion` is a required
  # status check, and without this trigger the queue entry never receives it,
  # waits out check_response_timeout_minutes, and is dropped.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read  # the reusable workflow's gate reads open PRs to skip redundant push runs

jobs:
  verify:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-pyprojectx-verify.yml@4962f9875826f8f73cd04987278f30b6cd8365d7 # v0.21.0
    # Optional inputs (all have sensible defaults):
    # with:
    #   python-version: '3.12'           # Leave empty to let uv manage from pyproject.toml
    #   cache-dependency-glob: 'uv.lock' # Glob pattern for cache dependencies
    #   upload-artifacts-on-failure: true # Upload test artifacts on failure
    #   verify-goals: 'quality-gate module-tests'  # pw goals, run in order
    #   verify-args: 'workflow'           # Extra args appended to every goal
