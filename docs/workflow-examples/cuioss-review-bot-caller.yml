# Example: cuioss-review-bot review workflow (third automated reviewer — PR-Agent on Google Gemini)
# Copy this file to .github/workflows/cuioss-review-bot.yml in your repository.
#
# Adoption is opt-in: a repository is reviewed only once this workflow exists in it.
# All tuning is central — cuioss/cuioss-review-bot (.pr_agent.toml). Nothing is copied here.
# Pin the reusable workflow at the release that first contains it (or later).
#
# The review charter is a second, separate opt-in, declared in .github/project.yml on the
# default branch — never in this file:
#
#   cuioss-review-bot:
#     enabled: true            # absent or false keeps the central charter
#     packs: [java]            # domain packs appended after the spine (not selectable)
#     additional_rules: []     # repository rules appended after every pack
#
# Without `enabled: true` the review keeps the central charter. See docs/project-yml-schema.adoc.
#
# Prerequisites (organization-wide; already in place in cuioss):
#   - cuioss-review-bot GitHub App installed org-wide
#   - org secrets REVIEW_APP_ID, REVIEW_APP_PRIVATE_KEY
#   - org variables GCP_WIF_PROVIDER, GCP_REVIEW_SERVICE_ACCOUNT, GCP_PROJECT_ID
#     (Vertex AI is reached keylessly, so these are variables, not secrets)
#   - the skip-bot-review label present in the repository (gh label create skip-bot-review)
#
# In ANOTHER organisation none of that is inherited: the App must be installed there, the two
# secrets and the variables defined there, a settings repository answering to
# <org>/pr-agent-settings provided there, and the Google Workload Identity trust widened to
# that organisation's repositories. The exact list is "Using the reviewer from another
# organisation" in docs/cuioss-review-bot.adoc. Such a caller also sets `settings-repository`
# below.

name: cuioss-review-bot Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # Enables the on-demand slash commands (/review, /ask, /improve, /help) as PR comments.
  # This is also how a re-review is requested after pushing fixes — there is deliberately no
  # automatic re-review on every push.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required: mints the OIDC token Workload Identity Federation exchanges for the short-lived
  # GCP credentials the reviewer uses to reach Gemini on Vertex AI.
  id-token: write

jobs:
  review:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-cuioss-review-bot.yml@ae4ad6937ec755800c4a77d22e426aba679bf91c # v0.38.0
    # Map only what the reviewer needs. `secrets: inherit` would hand it every caller secret
    # (GPG keys, Sonatype credentials, SONAR_TOKEN, …) for no reason; these two are the whole
    # requirement, because Vertex AI is reached keylessly.
    secrets:
      REVIEW_APP_ID: ${{ secrets.REVIEW_APP_ID }}
      REVIEW_APP_PRIVATE_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
    # Optional inputs (all have sensible defaults):
    # with:
    #   auto-review: true      # run /review on a new pull request
    #   auto-describe: false   # rewrites the PR description — leave off
    #   auto-improve: false    # duplicates CodeRabbit's suggestions — opt in per repo only
    #   timeout-minutes: 15
    #   # Only outside cuioss: the NAME of your organisation's settings repository. PR-Agent
    #   # always asks for <org>/pr-agent-settings, so name the repository exactly that (or
    #   # rename it from that and give the new name here).
    #   settings-repository: pr-agent-settings
