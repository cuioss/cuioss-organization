version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    # This repo's reusable workflows execute this repo's OWN composite actions
    # by SHA. Those refs are not ordinary dependencies: the release rewrites
    # them to the release commit before tagging, so that the tagged commit is
    # itself fully pinned. Dependabot instead resolves them to the newest commit
    # on main, which is neither the release commit nor the tag — it produced a
    # third SHA in #223 and would do so again every week.
    ignore:
      # Dependabot names these by full path, e.g.
      # cuioss/cuioss-organization/.github/actions/read-project-config.
      #
      # `.github` must appear LITERALLY. Dependabot matches with fnmatch, whose
      # `*` will not match a path component that begins with a dot, so
      # "cuioss/cuioss-organization*", ".../*" and ".../**" all failed — each
      # needs its star to cross `/.github`. Verified: all three were in place
      # when Dependabot recreated #228 and churned the refs anyway.
      - dependency-name: "cuioss/cuioss-organization"
      - dependency-name: "cuioss/cuioss-organization/.github/actions/*"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1

  # Python (for setup scripts)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
