name: Pyprojectx Verify (Reusable)
# Reusable workflow for projects using pyprojectx (pw) build system

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use (empty = let uv manage)'
        required: false
        type: string
        default: ''
      cache-dependency-glob:
        description: 'Glob pattern for uv cache dependencies'
        required: false
        type: string
        default: 'uv.lock'
      upload-artifacts-on-failure:
        description: 'Upload test artifacts on failure'
        required: false
        type: boolean
        default: false
      verify-goals:
        description: >-
          Space-separated pw goals to run, in order (e.g. 'quality-gate
          module-tests'). Each goal is run as './pw <goal>'; the first failing
          goal fails the job. Goal tokens must match [a-z][a-z0-9-]* — anything
          else fails the run.
        required: false
        type: string
        default: 'verify'
      verify-args:
        description: >-
          Extra arguments appended to every goal invocation (e.g. a module
          filter). The pyprojectx equivalent of the maven reusable's profile
          inputs.
        required: false
        type: string
        default: ''
      pre-verify-goals:
        description: >-
          Space-separated pw goals run in order BEFORE verify-goals, in the same
          job and workspace (e.g. 'generate'). For consumers whose tests assert
          over generated artifacts: a separate job would not share the
          filesystem. Each goal is run as './pw <goal>'; the first failing goal
          fails the job. Same token rule as verify-goals. Empty (the default)
          runs nothing.
        required: false
        type: string
        default: ''
      pre-verify-args:
        description: >-
          Extra arguments appended to every pre-verify goal invocation (e.g.
          '--target all --output target'). Independent of verify-args, which
          applies to the verify goals only.
        required: false
        type: string
        default: ''
      skip-on-docs-only:
        description: >-
          Skip verify when only documentation/config files changed (footprint
          filter). Opt-in — the default (false) preserves the current
          always-verify behavior; each consumer enables it explicitly, matching
          the maven reusable's toggle. Also applies to merge_group runs: the
          queue diffs merge_group.base_sha..head_sha, so a docs-only entry
          skips verify there too and still reports a green conclusion.
        required: false
        type: boolean
        default: false
      extra-buildable:
        description: >-
          Space-separated glob patterns that force verify even when all changed
          paths would otherwise be skipped by the footprint filter (e.g. test
          inputs located under ignored directories like '.plan/marshal.json
          .claude/**').
        required: false
        type: string
        default: ''


permissions:
  contents: read

# Cancel a superseded in-progress run only for pull requests: pushing a new commit
# to a PR makes the older run's result irrelevant, so freeing that runner speeds up
# feedback. Grouped by caller workflow + ref + event so a push, a PR, and a
# merge_group run never share a group. cancel-in-progress is deliberately limited to
# pull_request: push runs on the default branch and merge_group runs (the merge
# queue) must always run to completion and are never cancelled.
#
# This is complementary to — not overlapping with — the gate job below. The gate
# skips a REDUNDANT run (a push whose commit an open PR already covers, or a change
# that touches only non-building files); concurrency cancels a SUPERSEDED run (an
# older commit on the same PR). merge_group runs are never cancelled and never
# push-deduplicated; the gate skips them only on the footprint rule.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether this run should proceed, from two independent skip reasons:
  #   1. Footprint skip (opt-in via skip-on-docs-only): every changed path is a
  #      non-building doc/config file, so the heavy verify is unnecessary.
  #   2. Push-dedup skip: a push whose commit is already covered by an open PR
  #      (the PR's own run verifies that commit), so the push run is redundant.
  # Either reason can skip. A merge_group run is subject to the footprint skip
  # only (never to push-dedup), and the default branch always runs unless the
  # footprint skip applies. The `conclusion` job reports SUCCESS when the gate
  # deliberately skips verify, which keeps a skipped run merge-queue-safe.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Footprint filter (opt-in via skip-on-docs-only): decide whether any
      # changed path is a building file. Runs on merge_group too: the event
      # carries merge_group.base_sha (the queue base — the target branch, or the
      # group ahead) and merge_group.head_sha (that base plus this group), so
      # their diff is everything the merge group adds on top of an
      # already-verified base. A group can batch several PRs: it is skipped only
      # when the WHOLE batch contains no buildable path, in which case the merge
      # result builds exactly like its base. The paths-filter step is continue-on-error so a diff-base error
      # fails OPEN: `footprint.outcome` is then not 'success' and the decide step
      # runs the verification rather than skipping it.
      #
      # A default shallow checkout is enough on merge_group: it holds head_sha
      # (GITHUB_SHA), and paths-filter fetches a base SHA missing locally itself
      # (`git fetch --depth=1 origin <sha>`) before a two-dot diff, which needs
      # only the two commits' trees. An unfetchable base_sha throws inside
      # paths-filter, i.e. fails open.
      - name: Checkout
        if: ${{ inputs.skip-on-docs-only }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOT the shared build-paths-filter-spec action: this workflow is dogfooded by
      # this very repo's own python-verify.yml via a LOCAL path reference, so this
      # step always runs against the working-tree version of THIS file on every PR —
      # there is no release boundary to hide a stale remote pin behind. A `uses:`
      # reference to a composite action resolves against the CALLING repository, not
      # this one, so a local `./` reference here would break every external consumer
      # instead. Kept as a static inline list — there is no dynamic `extra` input on
      # this workflow, so the glob-safety bug the shared action exists to prevent does
      # not apply here anyway.
      - name: Build paths-filter spec
        id: build-filter
        if: ${{ inputs.skip-on-docs-only }}
        run: |
          {
            echo 'spec<<EOF'
            echo 'buildable:'
            echo "  - '!**/*.adoc'"
            echo "  - '!**/*.md'"
            echo "  - '!doc/**'"
            echo "  - '!.plan/**'"
            echo "  - '!.claude/**'"
            echo "  - '!.agents/**'"
            echo "  - '!.opencode/**'"
            echo "  - '!opencode.json'"
            echo "  - '!.vscode/**'"
            echo "  - '!.gitignore'"
            echo "  - '!.github/project.yml'"
            echo "  - '!.github/dependabot.yml'"
            echo "  - '!LICENSE'"
            echo "  - '!NOTICE'"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # predicate-quantifier MUST be 'every': the spec is all-negation, so
      # dorny's default 'some' would OR the patterns and any non-.adoc file would
      # match '!**/*.adoc', leaving 'buildable' always true. 'every' ANDs them,
      # so a path counts as buildable only when it matches none of the ignore
      # globs — i.e. buildable == 'false' iff EVERY changed path is non-building.
      #
      # base/ref: paths-filter v4.0.3 already defaults them to
      # merge_group.base_sha/head_sha on a merge_group event (explicit inputs
      # take precedence); they are passed explicitly so the diff range is visible
      # here and cannot drift with an upstream default. Both are '' on every
      # other event, which is exactly the unset default (pull_request diffs via
      # the API, push against the default branch).
      - name: Footprint filter
        id: footprint
        if: ${{ inputs.skip-on-docs-only }}
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'every'
          filters: ${{ steps.build-filter.outputs.spec }}
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}

      # Build paths-filter spec for extra-buildable patterns (positive matching,
      # default predicate-quantifier 'some'). Any changed file matching ANY
      # pattern here forces verify even when the base footprint filter above
      # evaluated to non-building.
      - name: Build extra-buildable filter spec
        id: build-extra-filter
        if: ${{ inputs.skip-on-docs-only && inputs.extra-buildable != '' }}
        env:
          EXTRA_PATTERNS: ${{ inputs.extra-buildable }}
        run: |
          python3 -c '
          import os
          patterns = os.environ.get("EXTRA_PATTERNS", "").split()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("spec<<EOF\nextra:\n")
              for p in patterns:
                  f.write(f"  - \"{p}\"\n")
              f.write("EOF\n")
          '

      - name: Extra footprint filter
        id: extra-footprint
        if: ${{ inputs.skip-on-docs-only && inputs.extra-buildable != '' }}
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ steps.build-extra-filter.outputs.spec }}
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}

      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SKIP_ON_DOCS_ONLY: ${{ inputs.skip-on-docs-only }}
          FOOTPRINT_OUTCOME: ${{ steps.footprint.outcome }}
          BUILDABLE: ${{ steps.footprint.outputs.buildable }}
          EXTRA_OUTCOME: ${{ steps.extra-footprint.outcome }}
          EXTRA_BUILDABLE: ${{ steps.extra-footprint.outputs.extra }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # Footprint skip (independent of the push-dedup skip below — either can
          # skip). Fail-open: skip ONLY when the paths-filter ran cleanly
          # (outcome 'success') AND reported no buildable paths. Any filter or
          # diff-base error (outcome != 'success') falls through and runs verify.
          footprint_ok=false
          if [[ "$SKIP_ON_DOCS_ONLY" == "true" && "$FOOTPRINT_OUTCOME" == "success" && "$BUILDABLE" == "false" ]]; then
            if [[ "$EXTRA_BUILDABLE" == "true" ]]; then
              echo "Path matched extra-buildable filter — forcing verify"
            elif [[ -n "$EXTRA_OUTCOME" && "$EXTRA_OUTCOME" != "success" ]]; then
              echo "Extra-buildable filter failed (outcome: $EXTRA_OUTCOME) — failing open to verify"
            else
              footprint_ok=true
            fi
          fi

          # merge_group additionally needs a resolvable queue base: without a
          # 40-hex base_sha paths-filter would silently fall back to a merge-base
          # diff against the default branch, which is not the range this skip is
          # justified by — fail open and build the merge result instead.
          if [[ "$EVENT_NAME" == "merge_group" && ! "$MERGE_GROUP_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "merge_group run without a resolvable base_sha — building the full merge result"
            footprint_ok=false
          fi
          if [[ "$footprint_ok" == "true" ]]; then
            echo "Only non-building (docs/config) files changed — skipping verify"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Non-push events (pull_request, merge_group, workflow_dispatch, …)
          # always run unless the footprint skip above applied.
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The default branch always runs.
          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Push to a non-default branch: skip if an open SAME-REPO PR already
          # covers it — the pull_request run verifies the same commit. Only internal
          # PRs count: a fork PR that happens to reuse this branch name verifies a
          # different repo's commit, so cross-repository PRs are excluded (gh's
          # --head matches a bare branch name across forks). Fail open — a transient
          # lookup error runs the verification rather than skipping it.
          if ! count="$(gh pr list --repo "$GH_REPO" --head "$REF_NAME" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)] | length')"; then
            echo "PR lookup failed for '$REF_NAME' — defaulting to run push verification"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "${count:-0}" -gt 0 ]]; then
            echo "Open same-repo PR exists for '$REF_NAME' — skipping push run (the PR run verifies this commit)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No open same-repo PR for '$REF_NAME' — running push verification"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project.yml configuration
        id: config
        uses: cuioss/cuioss-organization/.github/actions/read-project-config@2482456e205eb618b2f09ae48800cb5ef786ad7a # v0.39.0
        with:
          caller-inputs: ${{ toJSON(inputs) }}

      - name: Set up Python ${{ steps.config.outputs.pyprojectx-python-version }}
        if: ${{ steps.config.outputs.pyprojectx-python-version != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.config.outputs.pyprojectx-python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ steps.config.outputs.pyprojectx-cache-dependency-glob }}

      # Resolve config-over-input, then validate BEFORE anything reaches a `run:`
      # command line. Config text is untrusted: it is carried in via env (never
      # interpolated into the shell body) and every goal token must match the
      # conservative allowlist, so no goal can smuggle shell metacharacters.
      #
      # The pre-verify goals go through the SAME allowlist, here and not in their
      # own step, so an invalid pre-goal fails the run before any goal — pre or
      # verify — executes. Unlike verify-goals they may be empty: that is the
      # default and means "no hook". Their args are sanitized by read-project-config
      # exactly like verify-args (a value with an unsafe token is dropped whole).
      - name: Resolve and validate build targets
        id: targets
        env:
          VERIFY_GOALS: ${{ steps.config.outputs.pyprojectx-verify-goals }}
          VERIFY_ARGS: ${{ steps.config.outputs.pyprojectx-verify-args }}
          PRE_VERIFY_GOALS: ${{ steps.config.outputs.pyprojectx-pre-verify-goals }}
          PRE_VERIFY_ARGS: ${{ steps.config.outputs.pyprojectx-pre-verify-args }}
        run: |
          if [[ -z "${VERIFY_GOALS// /}" ]]; then
            echo "::error::verify-goals is empty — expected at least one pw goal"
            exit 1
          fi
          for goal in $VERIFY_GOALS; do
            if [[ ! "$goal" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "::error::invalid pw goal '$goal' — goals must match [a-z][a-z0-9-]*"
              exit 1
            fi
          done
          for goal in $PRE_VERIFY_GOALS; do
            if [[ ! "$goal" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "::error::invalid pre-verify pw goal '$goal' — goals must match [a-z][a-z0-9-]*"
              exit 1
            fi
          done
          echo "Resolved pre-verify goals: ${PRE_VERIFY_GOALS:-<none>}"
          echo "Resolved pre-verify args: ${PRE_VERIFY_ARGS:-<none>}"
          echo "Resolved goals: $VERIFY_GOALS"
          echo "Resolved args: ${VERIFY_ARGS:-<none>}"
          {
            echo "pre-goals=$PRE_VERIFY_GOALS"
            echo "pre-args=$PRE_VERIFY_ARGS"
            echo "goals=$VERIFY_GOALS"
            echo "args=$VERIFY_ARGS"
          } >> "$GITHUB_OUTPUT"

      # Pre-verify hook: build goals that must run before verification, in THIS job
      # and workspace. It exists for consumers whose tests assert over generated
      # artifacts (e.g. `./pw generate` writing target trees under target/): a
      # clean checkout has none, and a separate job cannot supply them — jobs share
      # no filesystem, and a caller cannot inject a download step into a `uses:`
      # job. The goals are allowlisted tokens and the args word-split DATA, both
      # handed over via env exactly as in "Run verification", so no configured
      # text ever becomes part of the shell body.
      #
      # Skipped when no pre-goal is configured (the default), so a consumer that
      # sets neither input executes exactly the commands it did before. A failing
      # pre-goal fails the job with an annotation naming it; it is never skipped
      # over, and verification does not run on top of half-generated inputs.
      - name: Run pre-verify goals
        if: ${{ steps.targets.outputs.pre-goals != '' }}
        env:
          PRE_GOALS: ${{ steps.targets.outputs.pre-goals }}
          PRE_ARGS: ${{ steps.targets.outputs.pre-args }}
        run: |
          for goal in $PRE_GOALS; do
            echo "::group::./pw $goal"
            # PRE_ARGS is deliberately unquoted so it word-splits into separate
            # arguments; it is data for pw, never a shell command.
            if ! ./pw "$goal" $PRE_ARGS; then
              echo "::endgroup::"
              echo "::error::pre-verify pw goal '$goal' failed"
              exit 1
            fi
            echo "::endgroup::"
          done

      # GitHub Actions cannot emit a dynamic number of steps, so the goals are run
      # in one step with a ::group:: per goal. The loop exits on the first failure
      # and annotates which goal failed, giving the same attribution a per-goal step
      # name would.
      - name: Run verification
        env:
          GOALS: ${{ steps.targets.outputs.goals }}
          ARGS: ${{ steps.targets.outputs.args }}
        run: |
          for goal in $GOALS; do
            echo "::group::./pw $goal"
            # ARGS is deliberately unquoted so it word-splits into separate
            # arguments; it is data for pw, never a shell command.
            if ! ./pw "$goal" $ARGS; then
              echo "::endgroup::"
              echo "::error::pw goal '$goal' failed"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Upload test results
        # project.yml wins when it sets the key; the input applies only when unset.
        if: >-
          ${{ failure() && steps.config.outputs.pyprojectx-upload-artifacts-on-failure == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            .pytest_cache/
            .mypy_cache/
          retention-days: 5

  # Gate job for branch protection — always runs, reports the aggregate result.
  # Require `verify / conclusion` in branch protection (uniform with the Maven build).
  conclusion:
    if: always()
    needs: [gate, verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate workflow result
        run: |
          # A gate-job failure/cancellation must fail — never mask it as a skip.
          if [[ "${{ needs.gate.result }}" != "success" ]]; then
            echo "::error::gate job did not succeed (${{ needs.gate.result }})"
            exit 1
          fi
          # Gate deliberately skipped this run (a push whose commit is covered by an
          # open PR, or a docs-only change — including a docs-only merge_group
          # entry) — the verify job is skipped on purpose, so report success. This
          # is what lets the merge queue land a gate-skipped entry.
          if [[ "${{ needs.gate.outputs.run }}" != "true" ]]; then
            echo "Gate skipped this run (open PR covers the commit, or docs-only change)"
            exit 0
          fi
          if [[ "${{ needs.verify.result }}" == "failure" || "${{ needs.verify.result }}" == "cancelled" ]]; then
            echo "::error::verify job failed or was cancelled"
            exit 1
          fi
          echo "verify passed or was correctly skipped"
