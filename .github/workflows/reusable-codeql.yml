name: CodeQL Analysis (Reusable)

on:
  workflow_call:
    inputs:
      languages:
        description: 'Comma-separated list of languages to analyze (e.g., "java", "javascript", "python")'
        required: true
        type: string
      query-suite:
        description: 'Query suite to use (default, security-extended, security-and-quality)'
        required: false
        type: string
        default: 'default'
      build-command:
        description: 'Custom build command (for compiled languages). Leave empty for autobuild.'
        required: false
        type: string
        default: ''
      build-mode:
        description: 'CodeQL build mode: autobuild | none | manual. Leave empty to use CodeQL''s per-language default (current behavior).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.languages) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          build-mode: ${{ inputs.build-mode }}

      - name: Autobuild
        if: inputs.build-mode != 'none' && inputs.build-mode != 'manual' && inputs.build-command == ''
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Custom build
        if: inputs.build-mode != 'none' && inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
