name: Maven Build (Reusable)

on:
  workflow_call:
    inputs:
      java-versions:
        description: 'JSON array of Java versions to test'
        required: false
        type: string
        default: '["21","25"]'
      enable-sonar:
        description: 'Enable SonarCloud analysis'
        required: false
        type: boolean
        default: true
      enable-snapshot-deploy:
        description: 'Deploy snapshots to Maven Central'
        required: false
        type: boolean
        default: true
      npm-cache:
        description: 'Enable npm package caching'
        required: false
        type: boolean
        default: false
      maven-profiles-snapshot:
        description: 'Maven profiles for snapshot deployment'
        required: false
        type: string
        default: 'release-snapshot,javadoc'
      skip-sonar-on-dependabot:
        description: 'Skip Sonar analysis for Dependabot PRs'
        required: false
        type: boolean
        default: true
      java-version:
        description: 'Java version for Sonar analysis and snapshot deploy'
        required: false
        type: string
        default: '21'
      skip-on-docs-only:
        description: 'Skip build when only documentation/config files changed'
        required: false
        type: boolean
        default: true
      paths-ignore-extra:
        description: 'Space-separated extra glob patterns to treat as non-code'
        required: false
        type: string
        default: ''
      snapshot-deploy-timeout:
        description: 'Timeout in minutes for the snapshot deploy job'
        required: false
        type: number
        default: 30
      build-timeout:
        description: 'Timeout in minutes for the build and sonar-build jobs'
        required: false
        type: number
        default: 45
    secrets:
      SONAR_TOKEN:
        required: false
      OSS_SONATYPE_USERNAME:
        required: false
      OSS_SONATYPE_PASSWORD:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

# Cancel a superseded in-progress run only for pull requests: pushing a new commit
# to a PR makes the older run's result irrelevant, so freeing that runner speeds up
# feedback. Grouped by caller workflow + ref + event so a push, a PR, and a
# merge_group run never share a group. cancel-in-progress is deliberately limited to
# pull_request: push runs on the default branch (snapshot deploy) and merge_group runs
# (the merge queue) must always run to completion and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether this run should proceed. Skips a push-triggered build when an
  # open PR already covers the same branch — the PR's own run builds that commit
  # (and produces a Sonar pull-request analysis), so the push build is redundant.
  # A push to a branch with no open PR still builds (branch analysis + quality),
  # and the default branch always builds (Sonar baseline + snapshot deploy).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Non-push events (pull_request, workflow_dispatch, …) always run.
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The default branch always runs (post-merge baseline + snapshot deploy).
          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Push to a non-default branch: skip if an open SAME-REPO PR already
          # covers it — the pull_request run builds the same commit (with PR-scoped
          # Sonar). Only internal PRs count: a fork PR that happens to reuse this
          # branch name builds a different repo's commit, so cross-repository PRs
          # are excluded (gh's --head matches a bare branch name across forks).
          # Fail open — a transient lookup error runs the build rather than skipping it.
          if ! count="$(gh pr list --repo "$GH_REPO" --head "$REF_NAME" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)] | length')"; then
            echo "PR lookup failed for '$REF_NAME' — defaulting to run push build"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "${count:-0}" -gt 0 ]]; then
            echo "Open same-repo PR exists for '$REF_NAME' — skipping push build (the PR run builds this commit)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No open same-repo PR for '$REF_NAME' — running push build"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The gate above skips a push build on the assumption that a `pull_request` run
  # will cover the same commit. That run can be delayed several minutes — or never
  # appear at all: GitHub has been observed to silently drop the triggering event,
  # and the PR can also close before its own run starts. Either way, nothing then
  # builds the commit, and (before this job existed) `conclusion` could only poll
  # and fail closed — permanently, since a repeat of the same push re-runs `gate`,
  # which reaches the same "skip" verdict and never builds it either. See #279.
  #
  # This job waits for the covering run exactly as `conclusion` used to, but
  # instead of only reporting failure it outputs a `rescue` signal: when no other
  # lane can build this commit, THIS push run builds it itself (see `config`
  # below). The rare cost is a duplicate build if the covering run turns up just
  # after the rescue decision; the alternative was an unrecoverable red required
  # check that only a brand-new commit could clear.
  # CALLER CONTRACT: a called workflow can only restrict the caller's token, never
  # escalate it. The caller's `permissions:` block MUST therefore include
  # `actions: read`, or GitHub rejects the whole run with a startup failure before
  # any job executes. See docs/workflow-examples/maven-build-caller.yml.
  # `pull-requests: read` is already in that contract (the gate job needs it), so
  # requiring it here adds nothing a caller does not already grant.
  #
  # The decision itself lives in workflow-scripts/covering-run-check.py, not
  # inline here — it polls, branches on JSON responses, and needs to be unit
  # tested (test/workflow/test_covering_run_check.py) the way an inline `run:`
  # script cannot be.
  covering-run-check:
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.run == 'false'
    runs-on: ubuntu-latest
    # Long enough to outlast the script's default 300s poll plus surrounding steps.
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
    outputs:
      rescue: ${{ steps.check.outputs.rescue }}
    steps:
      # Checked out into a subdirectory: this job runs in the CALLER's context, so
      # the script that makes the decision has to be fetched from this repo first.
      #
      # This ref selects which revision of workflow-scripts/ executes, so it is an
      # executed reference exactly like a `uses:` pin — do not hand-edit it out of
      # step with its siblings. The release job's pre-tag pass rewrites it to the
      # commit being tagged, and check-internal-pinning.py fails the release if it
      # ever disagrees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cuioss/cuioss-organization
          ref: a7563de07d43b1e7df18b4500cdfcd1e1474a3ea # v0.30.0
          sparse-checkout: workflow-scripts
          path: .cuioss-organization

      - name: Wait for the covering pull_request run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python3 .cuioss-organization/workflow-scripts/covering-run-check.py \
            --repo "$GH_REPO" \
            --sha "$HEAD_SHA" \
            --ref "$REF_NAME" \
            --workflow-name "$WORKFLOW_NAME" >> "$GITHUB_OUTPUT"

  # Read project.yml configuration to use as defaults
  config:
    needs: [gate, covering-run-check]
    # always(): covering-run-check is itself skipped whenever gate already said
    # "run" (the common case for pull_request/workflow_dispatch/default-branch
    # events, and for a push with no open PR) — without always() that skip would
    # read as a non-success dependency and take config down with it.
    if: always() && (needs.gate.outputs.run == 'true' || needs.covering-run-check.outputs.rescue == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      java-versions: ${{ steps.config.outputs.java-versions }}
      java-version: ${{ steps.config.outputs.java-version }}
      enable-snapshot-deploy: ${{ steps.config.outputs.enable-snapshot-deploy }}
      maven-profiles-snapshot: ${{ steps.config.outputs.maven-profiles-snapshot }}
      npm-cache: ${{ steps.config.outputs.npm-cache }}
      sonar-enabled: ${{ steps.config.outputs.sonar-enabled }}
      sonar-skip-on-dependabot: ${{ steps.config.outputs.sonar-skip-on-dependabot }}
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
      skip-on-docs-only: ${{ steps.config.outputs.skip-on-docs-only }}
      paths-ignore-extra: ${{ steps.config.outputs.paths-ignore-extra }}
      snapshot-deploy-timeout: ${{ steps.config.outputs.snapshot-deploy-timeout }}
      build-timeout: ${{ steps.config.outputs.build-timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/project.yml
          sparse-checkout-cone-mode: false

      - name: Read project.yml configuration
        id: config
        uses: cuioss/cuioss-organization/.github/actions/read-project-config@a7563de07d43b1e7df18b4500cdfcd1e1474a3ea # v0.30.0

  # Check if only documentation/config files changed (skip build if so).
  # Runs on merge_group too: paths-filter v4 resolves the diff base from the event
  # payload (merge_group.base_sha..merge_group.head_sha), so the queue evaluates the
  # *whole* merge group against its base. A docs-only PR batched with a code PR still
  # sees code in the diff and still builds; only an entirely non-code merge group skips.
  check-changes:
    needs: config
    if: needs.config.outputs.skip-on-docs-only != 'false' && inputs.skip-on-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-build: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This ref selects which revision of the action executes, so it is an
      # executed reference exactly like every other `uses:` pin — do not
      # hand-edit it out of step with its siblings.
      - name: Build paths-filter spec
        id: build-filter
        uses: cuioss/cuioss-organization/.github/actions/build-paths-filter-spec@a7563de07d43b1e7df18b4500cdfcd1e1474a3ea # v0.30.0
        with:
          extra: ${{ needs.config.outputs.paths-ignore-extra || inputs.paths-ignore-extra }}

      # predicate-quantifier MUST be 'every': the spec above is all-negation, and
      # dorny's default 'some' ORs the patterns, so any non-.adoc file matches
      # '!**/*.adoc' and the gate never skips. 'every' ANDs them, so a file counts
      # as code only when it matches none of the ignore globs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: ${{ steps.build-filter.outputs.spec }}

  build:
    needs: [config, check-changes]
    if: always() && needs.check-changes.outputs.should-build != 'false' && needs.config.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(needs.config.outputs.build-timeout || inputs.build-timeout) }}
    permissions:
      contents: read
    strategy:
      matrix:
        version: ${{ fromJson(needs.config.outputs.java-versions || inputs.java-versions) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.version }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache npm packages
        if: ${{ needs.config.outputs.npm-cache == 'true' || (needs.config.outputs.npm-cache == '' && inputs.npm-cache) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache npm's download cache AND installed node_modules so frontend builds
          # skip re-download and re-link on a cache hit. Keyed on the lock/manifest
          # files, so a dependency change busts it; a stale hit is simply overwritten.
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build with Maven, Java ${{ matrix.version }}
        run: ./mvnw --no-transfer-progress verify -Dmaven.compiler.release=${{ matrix.version }}

  # Assert the resolved io.smallrye.config family matches the smallrye release the
  # project's effective version.quarkus manages.
  #
  # java-ee-10-bom pins io.smallrye.config:*, and those pins can beat the
  # io.quarkus:quarkus-bom a consumer imports. Quarkus' deployment classes are compiled
  # against one specific smallrye-config release, so a mismatch fails augmentation at
  # runtime with "failed to access
  # io.smallrye.config.ConfigMappingLoader$ConfigMappingImplementation" — nothing is
  # split from Maven's point of view, so requireSameVersions is correctly silent and the
  # build stays green. It has shipped through cuioss-parent-pom twice.
  #
  # The gate being added in cuioss-parent-pom cannot cover this, because both inputs are
  # consumer-side facts: a consumer composes its own BOMs (import order decides which
  # smallrye pin wins), and cui-quarkus-parent explicitly SUPPORTS overriding
  # version.quarkus for an emergency pin — which moves quarkus-bom but not
  # java-ee-10-bom's inherited smallrye pin, producing the split while the parent-side
  # check still passes. So the assertion has to be made here, against what the consumer
  # actually resolves.
  #
  # Runs in parallel with build (it resolves, it does not compile) and skips itself
  # cleanly when version.quarkus is undefined, so non-Quarkus consumers pay one
  # help:evaluate and nothing more.
  quarkus-alignment:
    needs: [config, check-changes]
    if: always() && needs.check-changes.outputs.should-build != 'false' && needs.config.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ needs.config.outputs.java-version || inputs.java-version }} for the alignment check
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ needs.config.outputs.java-version || inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Checked out into a subdirectory, AFTER the consumer checkout above: an
      # actions/checkout with no `path:` clears the workspace root and would take this
      # with it. The directory holds no pom.xml, so it is invisible to the reactor.
      #
      # This ref selects which revision of workflow-scripts/ executes, so it is an
      # executed reference exactly like a `uses:` pin — do not hand-edit it out of step
      # with its siblings. The release job's pre-tag pass rewrites it to the commit being
      # tagged, and check-internal-pinning.py fails the release if it ever disagrees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cuioss/cuioss-organization
          ref: a7563de07d43b1e7df18b4500cdfcd1e1474a3ea # v0.30.0
          sparse-checkout: workflow-scripts
          path: .cuioss-organization

      # The two script timeouts sum to 20 minutes, deliberately under the job's 25 —
      # so a Maven call that hangs is killed by the script, which reports CANNOT
      # DETERMINE with a diagnostic, rather than by the runner, which reports a bare
      # "cancelled". The remaining 5 minutes cover checkout, setup-java and the cache
      # restore.
      - name: Check Quarkus / smallrye-config alignment
        run: |
          python3 .cuioss-organization/workflow-scripts/check-quarkus-alignment.py \
            --repo . \
            --evaluate-timeout 300 \
            --resolve-timeout 900

  # Skipped on merge_group: there is no PR context, and analyzing the throwaway
  # gh-readonly-queue/* branch would pollute Sonar and slow the queue — the PR
  # run has already passed the Sonar gate before entering the queue.
  sonar-build:
    needs: [config, check-changes, build]
    if: ${{ always() && needs.check-changes.outputs.should-build != 'false' && needs.build.result == 'success' && github.event_name != 'merge_group' && (needs.config.outputs.sonar-enabled != 'false' && inputs.enable-sonar) && !((needs.config.outputs.sonar-skip-on-dependabot == 'true' || (needs.config.outputs.sonar-skip-on-dependabot == '' && inputs.skip-sonar-on-dependabot)) && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(needs.config.outputs.build-timeout || inputs.build-timeout) }}
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ needs.config.outputs.java-version || inputs.java-version }} for Sonar-build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ needs.config.outputs.java-version || inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache npm packages
        if: ${{ needs.config.outputs.npm-cache == 'true' || (needs.config.outputs.npm-cache == '' && inputs.npm-cache) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache npm's download cache AND installed node_modules so frontend builds
          # skip re-download and re-link on a cache hit. Keyed on the lock/manifest
          # files, so a dependency change busts it; a stale hit is simply overwritten.
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B --no-transfer-progress verify -Psonar -Dsonar.projectKey=${{ needs.config.outputs.sonar-project-key }} -Dsonar.qualitygate.wait=true sonar:sonar

  # Build health is asserted DIRECTLY (needs.build.result == 'success'), never inferred
  # through sonar-build. needs.<job>.result == 'skipped' cannot distinguish "legitimately
  # not run" from "an upstream dependency failed", and sonar-build is skipped in BOTH
  # cases: when Sonar is disabled or skipped for dependabot, and when build fails (its own
  # condition requires needs.build.result == 'success'). Accepting 'skipped' as a pass
  # therefore let a red build publish - and because the deploy step runs -DskipTests on
  # the premise that the build already ran them, a build that failed ON A TEST would
  # compile cleanly here and publish a snapshot whose tests never passed. Consumers
  # resolve those snapshots.
  #
  # build is in `needs` for that assertion only; the deploy step rebuilds from source and
  # consumes no artifact from it. The sonar-build clause stays as it was: with build health
  # checked directly, 'skipped' there now means only what it is meant to mean.
  deploy-snapshot:
    needs: [config, check-changes, build, quarkus-alignment, sonar-build]
    if: ${{ always() && needs.check-changes.outputs.should-build != 'false' && (needs.config.outputs.enable-snapshot-deploy != 'false' && inputs.enable-snapshot-deploy) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.result == 'success' && needs.quarkus-alignment.result == 'success' && (needs.sonar-build.result == 'success' || needs.sonar-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(needs.config.outputs.snapshot-deploy-timeout || inputs.snapshot-deploy-timeout) }}
    permissions:
      contents: read
    outputs:
      # Exposed so `conclusion` can tell a non-SNAPSHOT version (post-release, no
      # deploy attempted, job still succeeds) apart from an actual publish.
      version: ${{ steps.project.outputs.version }}
      published: ${{ steps.verify-publish.outcome == 'success' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ needs.config.outputs.java-version || inputs.java-version }} for snapshot release
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ needs.config.outputs.java-version || inputs.java-version }}
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: maven

      - name: Cache npm packages
        if: ${{ needs.config.outputs.npm-cache == 'true' || (needs.config.outputs.npm-cache == '' && inputs.npm-cache) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache npm's download cache AND installed node_modules so frontend builds
          # skip re-download and re-link on a cache hit. Keyed on the lock/manifest
          # files, so a dependency change busts it; a stale hit is simply overwritten.
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Extract project version
        id: project
        run: echo "version=$(./mvnw --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      # The root project's own groupId:artifactId is the "representative artifact" the
      # publish check below reads back — it is part of every reactor build regardless of
      # packaging, so no per-project selection logic is needed.
      - name: Extract project coordinates
        id: coordinates
        if: ${{ endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        run: |
          echo "group-id=$(./mvnw --no-transfer-progress help:evaluate -Dexpression=project.groupId -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "artifact-id=$(./mvnw --no-transfer-progress help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT

      # Checked out into a subdirectory, AFTER the consumer checkout above: an
      # actions/checkout with no `path:` clears the workspace root and would take this
      # with it. The directory holds no pom.xml, so it is invisible to the reactor.
      #
      # This ref selects which revision of workflow-scripts/ executes, so it is an
      # executed reference exactly like a `uses:` pin — do not hand-edit it out of step
      # with its siblings. The release job's pre-tag pass rewrites it to the commit being
      # tagged, and check-internal-pinning.py fails the release if it ever disagrees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        with:
          repository: cuioss/cuioss-organization
          ref: a7563de07d43b1e7df18b4500cdfcd1e1474a3ea # v0.30.0
          sparse-checkout: workflow-scripts
          path: .cuioss-organization

      # `mvn deploy` exiting 0 only proves Maven finished without error — not that a
      # newer snapshot reached the repository. Read the pre-deploy state now, immediately
      # before the deploy step, so `deploy-start` brackets the deploy as tightly as
      # possible. See workflow-scripts/check-snapshot-published.py for why this exists
      # (cuioss-organization#278).
      - name: Record pre-deploy snapshot metadata
        id: before-publish
        if: ${{ endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        run: |
          python3 .cuioss-organization/workflow-scripts/check-snapshot-published.py record \
            --group-id "${{ steps.coordinates.outputs.group-id }}" \
            --artifact-id "${{ steps.coordinates.outputs.artifact-id }}" \
            --version "${{ steps.project.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Deploy Snapshot with Maven, version ${{ steps.project.outputs.version }}
        if: ${{ endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        # -DskipTests (not -Dmaven.test.skip=true): tests already ran in the build
        # job, so re-running them here is waste - but test SOURCES must still be
        # compiled. maven.test.skip=true disables maven-compiler-plugin:testCompile
        # entirely, leaving ${project.build.testOutputDirectory} empty, which silently
        # publishes empty classifier artifacts for any project that packages test
        # classes (e.g. cui-http's `generators` classifier). reusable-maven-release.yml
        # already uses -DskipTests; this keeps snapshot and release deploys symmetric.
        run: |
          # -T1 is load-bearing and must stay LAST-wins on the command line. A consuming
          # repository may set a parallel default in .mvn/maven.config (TokenSheriff sets
          # -T1C), and Maven treats maven.config as prepended to the command line, so
          # without this flag the deploy inherits that parallelism. The central-publishing
          # plugin aggregates artifacts across the reactor and publishes once; under a
          # parallel reactor that coordination deadlocks — the build prints
          # "Waiting for other projects build to finish..." every two seconds and never
          # progresses, so the job is eventually cancelled at its timeout with no error.
          # Observed in TokenSheriff run 34214468714: the spin began 66 seconds in and
          # produced 1779 identical lines before the cap. Because the reactor only emits
          # [INFO] while stuck, the failure is silent: a client-API fix merged and
          # published nothing, and consumers kept resolving the previous snapshot.
          ./mvnw -B -T1 --no-transfer-progress -P${{ needs.config.outputs.maven-profiles-snapshot || inputs.maven-profiles-snapshot }} deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # A `deploy` step that exits 0 is not proof of a publish (see the `record` step
      # above) — confirm the representative artifact's snapshot timestamp actually
      # advanced past both the pre-deploy reading and the moment this deploy started.
      - name: Verify the snapshot was actually published
        id: verify-publish
        if: ${{ endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        run: |
          python3 .cuioss-organization/workflow-scripts/check-snapshot-published.py verify \
            --group-id "${{ steps.coordinates.outputs.group-id }}" \
            --artifact-id "${{ steps.coordinates.outputs.artifact-id }}" \
            --version "${{ steps.project.outputs.version }}" \
            --before-timestamp "${{ steps.before-publish.outputs.before-timestamp }}" \
            --deploy-start "${{ steps.before-publish.outputs.deploy-start }}"

  # Gate job for branch protection — always runs, reports aggregate result
  conclusion:
    if: always()
    needs: [gate, covering-run-check, config, check-changes, build, quarkus-alignment, sonar-build, deploy-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate workflow result
        run: |
          # gate not succeeding (e.g. the runner crashed or hit its timeout) leaves
          # every downstream job skipped, since none of them can tell "gate decided
          # to skip" from "gate never got to decide" — check its result directly
          # rather than trust the outputs of a job that never finished.
          if [[ "${{ needs.gate.result }}" != "success" ]]; then
            echo "::error::gate job did not succeed"
            exit 1
          fi
          # covering-run-check failing/cancelling (e.g. it hit its own timeout) means
          # its rescue verdict is unknown — never mask that as a skip.
          if [[ "${{ needs.covering-run-check.result }}" == "failure" || "${{ needs.covering-run-check.result }}" == "cancelled" ]]; then
            echo "::error::covering-run-check job failed or was cancelled"
            exit 1
          fi
          # Config must have succeeded
          if [[ "${{ needs.config.result }}" == "failure" ]]; then
            echo "::error::config job failed"
            exit 1
          fi
          # Gate skipped the build and covering-run-check confirmed a pull_request run
          # already covers this commit (rescue == 'false') — config and everything
          # downstream are correctly skipped, so there is nothing further to check.
          if [[ "${{ needs.gate.outputs.run }}" == "false" && "${{ needs.covering-run-check.outputs.rescue }}" != "true" ]]; then
            echo "Push build skipped; a covering pull_request run was confirmed for this commit"
            exit 0
          fi
          # Docs-only: all downstream skips are expected
          if [[ "${{ needs.check-changes.outputs.should-build }}" == "false" ]]; then
            echo "Docs-only change — build correctly skipped"
            exit 0
          fi
          # Build must have succeeded
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.build.result }}" == "cancelled" ]]; then
            echo "::error::build job failed or was cancelled"
            exit 1
          fi
          # Quarkus alignment: failure is an error. A skip is OK — the job is gated on
          # the same docs-only/config conditions as build, and the script itself exits 0
          # for a non-Quarkus project rather than being skipped at the job level.
          if [[ "${{ needs.quarkus-alignment.result }}" == "failure" || "${{ needs.quarkus-alignment.result }}" == "cancelled" ]]; then
            echo "::error::quarkus-alignment job failed or was cancelled"
            exit 1
          fi
          # Sonar: failure is an error; skipped is OK (disabled, dependabot, etc.)
          if [[ "${{ needs.sonar-build.result }}" == "failure" || "${{ needs.sonar-build.result }}" == "cancelled" ]]; then
            echo "::error::sonar-build job failed"
            exit 1
          fi
          # Deploy-snapshot: failure is an error; skipped is OK (not on main, etc.)
          if [[ "${{ needs.deploy-snapshot.result }}" == "failure" || "${{ needs.deploy-snapshot.result }}" == "cancelled" ]]; then
            echo "::error::deploy-snapshot job failed"
            exit 1
          fi
          # A skipped job or a no-op deploy on the default branch can be entirely
          # deliberate (disabled for this repo, or a just-released non-SNAPSHOT version
          # pending the next dev-version bump) — but staying silent about *why* is
          # exactly what let cuioss-organization#278 happen: every check green while
          # nothing was actually published. Surface the reason so a deliberate skip
          # reads as deliberate, not as "nothing to see here".
          if [[ "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}" == "true" ]]; then
            if [[ "${{ needs.deploy-snapshot.result }}" == "skipped" ]]; then
              echo "::notice::deploy-snapshot skipped on the default branch — snapshot deploy is disabled for this repo (enable-snapshot-deploy=false)"
            elif [[ "${{ needs.deploy-snapshot.outputs.published }}" != "true" ]]; then
              echo "::notice::deploy-snapshot ran but published nothing — project version ${{ needs.deploy-snapshot.outputs.version }} is not a -SNAPSHOT (post-release, pending the next dev-version bump)"
            fi
          fi
          if [[ "${{ needs.gate.outputs.run }}" == "false" ]]; then
            echo "Push build rescued; no covering pull_request run was ever confirmed, so this push run built the commit itself"
          fi
          echo "All jobs passed or were correctly skipped"
