name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.current-version }}
      sha: ${{ steps.sha.outputs.sha }}
      consumer-matrix: ${{ steps.metadata.outputs.consumer-matrix }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The cuioss token: pushes, the tag and the GitHub Release all happen in this
      # repository. Consumer propagation mints its own token per consumer owner, in the
      # `update-consumers` job below.
      - name: Generate Release Token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: cuioss

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.release-token.outputs.token }}
          fetch-depth: 0

      - name: Read project metadata
        id: metadata
        uses: ./.github/actions/read-project-config

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "cuioss-release-bot"

      # The release commit already holds the composite-action and
      # workflow-scripts source. Pinning the reusable workflows to it is safe
      # and non-paradoxical: a commit cannot contain its own SHA, but it can
      # contain its parent's, and that source is byte-identical across the two.
      # The only thing the pinning pass below changes is the `uses:` and `ref:`
      # lines inside .github/workflows/reusable-*.yml, so nothing it pins can
      # differ between the two commits. This lets the tag land on a fully-pinned
      # commit.
      - name: Capture release commit SHA
        id: base
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit SHA: $SHA"

      - name: Pin internal action references
        run: |
          python3 workflow-scripts/update-workflow-references.py \
            --version "${{ steps.metadata.outputs.current-version }}" \
            --sha "${{ steps.base.outputs.sha }}" \
            --internal-only

      - name: Commit internal reference updates
        run: |
          git add -A || true
          if git diff --staged --quiet; then
            echo "No internal reference changes"
          else
            git commit -m "chore: pin internal action references for v${{ steps.metadata.outputs.current-version }}"
          fi

      # Guard: the commit about to be tagged is what every consumer executes.
      # Fail loudly rather than publish a tag whose own refs are mutable — or,
      # as v0.22.0 through v0.25.0 all did, pinned to the previous release.
      # --expect-sha is what closes that second hole: it is not enough for the
      # refs to be SHAs, they have to be *this* commit's.
      - name: Verify commit to be tagged is fully SHA-pinned
        run: |
          python3 workflow-scripts/check-internal-pinning.py \
            --expect-sha "${{ steps.base.outputs.sha }}"

      - name: Create version tag
        id: tag
        run: |
          VERSION="v${{ steps.metadata.outputs.current-version }}"
          echo "Creating tag: $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get tag SHA
        id: sha
        run: |
          SHA=$(git rev-parse "${{ steps.tag.outputs.version }}^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Tag SHA: $SHA"

      # Consumer-facing references (docs, examples, usage comments) point at
      # the tag, so they can only be written once the tag exists. This commit
      # lands after the tag and is deliberately not part of the released
      # artifact — it changes no executed code.
      - name: Update consumer-facing workflow references
        run: |
          python3 workflow-scripts/update-workflow-references.py \
            --version "${{ steps.metadata.outputs.current-version }}" \
            --sha "${{ steps.sha.outputs.sha }}"

      - name: Commit reference updates
        run: |
          git add -A || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update workflow references to ${{ steps.tag.outputs.version }}"
          fi

      - name: Push commits and tag
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ steps.release-token.outputs.token }}
          branch: ${{ github.ref_name }}
          tags: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.release-token.outputs.token }}
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          generate_release_notes: ${{ steps.metadata.outputs.create-github-release == 'true' }}
          make_latest: true
          body: |
            ## SHA for workflow references

            Use this SHA to reference cuioss-organization workflows:

            ```
            ${{ steps.sha.outputs.sha }}
            ```

            ### Example usage

            ```yaml
            jobs:
              build:
                uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@${{ steps.sha.outputs.sha }} # ${{ steps.tag.outputs.version }}
                secrets: inherit
            ```

      - name: Write release summary
        env:
          VERSION: ${{ steps.metadata.outputs.current-version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          {
            echo "## Release v${VERSION} Summary"
            echo ""
            echo "**Version:** v${VERSION}"
            echo "**SHA:** \`${SHA}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Open the workflow-pin update PR in every consumer repository.
  #
  # One matrix leg per consumer OWNER, because an installation token of a GitHub App is
  # valid for exactly one account: a consumer in another organisation cannot be reached
  # with the cuioss token. Each leg mints its own token — from cuioss-release-bot for
  # cuioss, from that organisation's own release App for any other owner — with `owner:`
  # set to that account, and updates that owner's consumers only. The grouping
  # comes from read-project-config's `consumer-matrix`, the one place the
  # `[<owner>/]<repo>` syntax is parsed.
  update-consumers:
    name: update-consumers (${{ matrix.group.owner }})
    needs: [release]
    if: needs.release.outputs.consumer-matrix != '' && needs.release.outputs.consumer-matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One owner's failure — a missing installation, say — must not cancel the others.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.release.outputs.consumer-matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # WHICH App propagates depends on the owner. cuioss consumers are reached with
      # cuioss-release-bot (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY). Every other owner has
      # its own private release App, installed only on that account, whose credentials are
      # stored in cuioss as RELEASE_APP_ID_<OWNER> / RELEASE_APP_PRIVATE_KEY_<OWNER>
      # (plan-marshall -> ..._PLAN_MARSHALL). read-project-config derives both names and
      # carries them in the matrix; the `secrets` context is indexed by them here.
      #
      # There is NO fallback to the cuioss App: a foreign owner's names always carry the
      # suffix, and an absent secret reads as the empty string. This step turns that into
      # an explicit `missing` list, so the token step is skipped and the propagation step
      # reports every consumer of this owner by the names of the secrets it lacks.
      - name: Check release App credentials
        id: app
        env:
          APP_ID: ${{ secrets[matrix.group.app-id-secret] }}
          PRIVATE_KEY: ${{ secrets[matrix.group.private-key-secret] }}
          APP_ID_SECRET: ${{ matrix.group.app-id-secret }}
          PRIVATE_KEY_SECRET: ${{ matrix.group.private-key-secret }}
        run: |
          MISSING=""
          if [ -z "$APP_ID_SECRET" ] || [ -z "$APP_ID" ]; then
            MISSING="${APP_ID_SECRET:-<no app-id secret name in the consumer matrix>}"
          fi
          if [ -z "$PRIVATE_KEY_SECRET" ] || [ -z "$PRIVATE_KEY" ]; then
            MISSING="${MISSING:+$MISSING, }${PRIVATE_KEY_SECRET:-<no private-key secret name in the consumer matrix>}"
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ -n "$MISSING" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Scoped to that App's installation on that one owner, nothing wider. It is NOT
      # narrowed to the listed repositories, because a token request naming one repository
      # the installation cannot see is refused as a whole, and a single stale entry would
      # then cost every consumer of that owner.
      #
      # continue-on-error: a failure here — the App not installed on the owner, a wrong ID
      # or key — must become one named error row per consumer in the summary below, written
      # by the next step, and not a bare red step.
      - name: Generate Propagation Token
        id: prop-token
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets[matrix.group.app-id-secret] }}
          private-key: ${{ secrets[matrix.group.private-key-secret] }}
          owner: ${{ matrix.group.owner }}

      # The scripts as they are at the tagged commit. Read-only: this job pushes nothing
      # to this repository, so the default token is not left in .git/config.
      - name: Checkout the released scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      # Everything that originates in project.yml reaches the shell through `env:` and jq,
      # never by interpolation into the script.
      - name: Update consumer repos
        id: update-consumers
        env:
          GH_TOKEN: ${{ steps.prop-token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.prop-token.outcome }}
          CREDENTIALS_MISSING: ${{ steps.app.outputs.missing }}
          APP_ID_SECRET: ${{ matrix.group.app-id-secret }}
          PRIVATE_KEY_SECRET: ${{ matrix.group.private-key-secret }}
          OWNER: ${{ matrix.group.owner }}
          CONSUMERS_JSON: ${{ toJSON(matrix.group.consumers) }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          # Collect results for summary
          RESULTS_FILE=$(mktemp)
          echo "RESULTS_FILE=$RESULTS_FILE" >> "$GITHUB_OUTPUT"
          echo "[]" > "$RESULTS_FILE"

          PROPAGATION_FAILED=0

          record_result() {
            jq --arg repo "$1" --argjson result "$2" \
              '. += [{"repo": $repo} + $result]' "$RESULTS_FILE" > "${RESULTS_FILE}.tmp" \
              && mv "${RESULTS_FILE}.tmp" "$RESULTS_FILE"
          }

          while IFS= read -r CONSUMER; do
            ENTRY=$(jq -r '.entry' <<<"$CONSUMER")
            REPO=$(jq -r '.repo' <<<"$CONSUMER")
            ENTRY_ERROR=$(jq -r '.error // ""' <<<"$CONSUMER")

            # A malformed entry has no repository to update. It is reported, and fails
            # the job: dropping it would leave that consumer silently on the old pin.
            if [ -n "$ENTRY_ERROR" ]; then
              echo "::error::consumer entry '$ENTRY': $ENTRY_ERROR"
              record_result "$ENTRY" "$(jq -nc --arg error "$ENTRY_ERROR" '{status: "error", error: $error}')"
              PROPAGATION_FAILED=1
              continue
            fi

            # No credentials for this owner's release App. Named by the secrets, because
            # that is what has to be created; never answered by borrowing another owner's App.
            if [ -n "$CREDENTIALS_MISSING" ]; then
              REASON="no release App credentials for '$OWNER': consumers of that owner need the secrets $APP_ID_SECRET and $PRIVATE_KEY_SECRET; missing or empty: $CREDENTIALS_MISSING"
              echo "::error::$OWNER/$REPO: $REASON"
              record_result "$OWNER/$REPO" "$(jq -nc --arg error "$REASON" '{status: "error", error: $error}')"
              PROPAGATION_FAILED=1
              continue
            fi

            # The credentials exist but yielded no token: the App they belong to is not
            # installed on this owner, or the ID and key do not match. The token step's log
            # has the API answer.
            if [ "$TOKEN_OUTCOME" != "success" ] || [ -z "$GH_TOKEN" ]; then
              REASON="no installation token for '$OWNER': the release App from $APP_ID_SECRET / $PRIVATE_KEY_SECRET is not installed on that account with access to $REPO, or its ID and private key do not match"
              echo "::error::$OWNER/$REPO: $REASON"
              record_result "$OWNER/$REPO" "$(jq -nc --arg error "$REASON" '{status: "error", error: $error}')"
              PROPAGATION_FAILED=1
              continue
            fi

            OUTPUT=$(python3 "$GITHUB_WORKSPACE/workflow-scripts/update-consumer-repo.py" \
              --org "$OWNER" \
              --repo "$REPO" \
              --version "$VERSION" \
              --sha "$SHA" 2>&1) || true
            echo "$OUTPUT"

            # Extract RESULT JSON line
            RESULT_LINE=$(echo "$OUTPUT" | grep '^RESULT:' | sed 's/^RESULT://')
            if [ -z "$RESULT_LINE" ]; then
              # The script died before emitting a result — a crash, a rejected
              # argument, a network error. Skipping it silently drops the repo
              # from the table below and leaves the job green, which is how
              # three consumers went unpropagated and unnoticed at v0.25.0.
              # Record it as an error row and fail the step once the summary
              # has been written.
              REASON=$(echo "$OUTPUT" | tail -n 3 | tr '\n|' '  ')
              RESULT_LINE=$(jq -nc --arg error "${REASON:-no output}" \
                '{status: "no_result", error: $error}')
              PROPAGATION_FAILED=1
            fi

            record_result "$OWNER/$REPO" "$RESULT_LINE"
          done < <(jq -c '.[]' <<<"$CONSUMERS_JSON")

          {
            echo "### Consumer Repository Updates: $OWNER"
            echo ""
            echo "**Version:** v${VERSION}"
            echo ""
            echo "| Repository | Status | PR |"
            echo "|---|---|---|"

            jq -r '.[] |
              if .status == "pr_auto_merge_enabled" then
                "| " + .repo + " | :hourglass: Auto-merge enabled | [PR](" + (.pr_url // "-") + ") |"
              elif .status == "pr_auto_merge_failed" then
                "| " + .repo + " | :x: Auto-merge FAILED (needs manual merge) | [PR](" + (.pr_url // "-") + ") |"
              elif .status == "pr_created" then
                "| " + .repo + " | :arrow_right: PR Created | [PR](" + (.pr_url // "-") + ") |"
              elif .status == "no_changes" then
                "| " + .repo + " | :heavy_minus_sign: No Changes | - |"
              elif .status == "no_result" then
                "| " + .repo + " | :x: FAILED - no result from script | " + (.error // "unknown") + " |"
              else
                "| " + .repo + " | :x: Error | " + (.error // "unknown") + " |"
              end' "$RESULTS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PROPAGATION_FAILED" = "1" ]; then
            echo "::error::At least one consumer of $OWNER was not propagated to - see the release summary"
            exit 1
          fi

      # always(): a propagation failure above must not hide the fate of the PRs
      # that were created before it.
      - name: Verify consumer PR merges
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.prop-token.outputs.token }}
          RESULTS_FILE: ${{ steps.update-consumers.outputs.RESULTS_FILE }}
        run: |
          if [ -n "$RESULTS_FILE" ] && [ -f "$RESULTS_FILE" ]; then
            python3 "$GITHUB_WORKSPACE/workflow-scripts/verify-consumer-prs.py" \
              --results-file "$RESULTS_FILE" \
              --timeout 300
            rm -f "$RESULTS_FILE"
          else
            echo "No results file found, skipping verification"
          fi
