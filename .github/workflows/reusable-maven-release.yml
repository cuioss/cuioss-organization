name: Maven Release (Reusable)
# Reusable workflow for Maven releases to Maven Central.
#
# With project.yml maven-build.deploy-target: github-packages the `release` job prepares,
# tags and pushes the release but publishes NOTHING: every Maven Central step is skipped
# and no Sonatype or GPG secret is read. The artifacts are then published from the tag by
# reusable-maven-github-packages-deploy.yml, which the caller invokes from a second job.
# That split is forced: a GitHub Packages deploy needs `packages: write` on the job's
# token, and a called workflow can only restrict the caller's token — requesting it here
# would give every Maven Central caller, none of which grants it, a startup failure.
# See docs/workflow-examples/maven-release-github-packages-caller.yml.

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      maven-profiles:
        description: 'Maven profiles for release (comma-separated)'
        required: false
        type: string
        default: 'release,javadoc'
      deploy-site:
        description: 'Deploy Maven site to GitHub Pages'
        required: false
        type: boolean
        default: true
    # Job-level outputs are not visible to a caller — a called workflow must
    # re-declare them here or `needs.<job>.outputs.*` in the caller evaluates to
    # the empty string. Without this block a caller building, say, a container
    # tag from released-version pushes `ghcr.io/cuioss/<repo>:` — malformed, or
    # worse a silently mislabelled image.
    outputs:
      released-version:
        description: 'The version that was released (release.current-version)'
        value: ${{ jobs.release.outputs.released-version }}
      consumers:
        description: >-
          Space-separated consumer entries from project.yml, as written there
          ([<owner>/]<repo>[:<hint>]; a bare repo is a cuioss repository)
        value: ${{ jobs.release.outputs.consumers }}
      dep-prop-group-id:
        description: 'Maven groupId used for dependency propagation'
        value: ${{ jobs.release.outputs.dep-prop-group-id }}
      dep-prop-artifact-id:
        description: 'Maven artifactId used for dependency propagation'
        value: ${{ jobs.release.outputs.dep-prop-artifact-id }}
      dep-prop-scope:
        description: 'Propagation scope: parent or dependency'
        value: ${{ jobs.release.outputs.dep-prop-scope }}
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
      # The four Maven Central secrets are required for a Maven Central release and
      # unused for deploy-target: github-packages, whose callers pass none of them.
      # `required` cannot depend on project.yml, so it is false here; a Maven Central
      # caller that omits them fails at release:perform (signing, then HTTP 401) —
      # before anything is pushed, since the push steps come after it.
      OSS_SONATYPE_USERNAME:
        required: false
      OSS_SONATYPE_PASSWORD:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      # Release Apps of OTHER organisations, for propagation to consumers listed as
      # `<owner>/<repo>`. Each such owner has its own private App; its credentials live in
      # cuioss as RELEASE_APP_ID_<OWNER> / RELEASE_APP_PRIVATE_KEY_<OWNER> (owner upper-cased,
      # every character outside [A-Z0-9] as `_`). The propagation job indexes the `secrets`
      # context by those names, so it sees them in either of two ways:
      #   - the caller passes them explicitly — possible only for a pair declared here,
      #     because GitHub rejects a secret the called workflow does not declare;
      #   - the caller uses `secrets: inherit` — then any owner's pair is visible without
      #     a declaration.
      # A caller with no consumer in that organisation passes neither. Add a pair here when
      # a new organisation gets consumers; a test keeps the names on the convention.
      RELEASE_APP_ID_PLAN_MARSHALL:
        description: 'App ID of plan-marshall-release-bot — only for callers with consumers in plan-marshall'
        required: false
      RELEASE_APP_PRIVATE_KEY_PLAN_MARSHALL:
        description: 'Private key of plan-marshall-release-bot — only for callers with consumers in plan-marshall'
        required: false

permissions:
  contents: read

jobs:
  # A pull_request-triggered invocation is a no-op unless release.current-version
  # actually changed on this merge — and a refusal even then if that version is
  # already tagged. workflow_dispatch proceeds unconditionally.
  #
  # This lives in the reusable workflow rather than in an opt-in action on
  # purpose: callers pin this workflow by SHA, so the guard reaches every caller
  # on a mechanical pin bump, while an opt-in action needs per-repo wiring — N
  # chances to get it wrong on a mechanism whose failure mode is an irrevocable
  # publish. See "Release Guard" in docs/Workflows.adoc.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      reason: ${{ steps.guard.outputs.reason }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # fetch-depth: 0 and fetch-tags are load-bearing, not tidiness. At the
      # default depth of 1 there is no first parent to compare against and no
      # tags to check, so the guard would read "unchanged" forever — green
      # because its subject was effectively deleted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Evaluate release guard
        id: guard
        uses: cuioss/cuioss-organization/.github/actions/release-guard@2482456e205eb618b2f09ae48800cb5ef786ad7a # v0.39.0

  release:
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released-version: ${{ steps.config.outputs.current-version }}
      consumers: ${{ steps.config.outputs.consumers }}
      consumer-matrix: ${{ steps.config.outputs.consumer-matrix }}
      dep-prop-group-id: ${{ steps.config.outputs.dep-prop-group-id }}
      dep-prop-artifact-id: ${{ steps.config.outputs.dep-prop-artifact-id }}
      dep-prop-scope: ${{ steps.config.outputs.dep-prop-scope }}
      deploy-target: ${{ steps.config.outputs.deploy-target }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate Release Token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},cuioss.github.io
          owner: cuioss

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.release-token.outputs.token }}
          fetch-depth: 0

      - name: Read project.yml configuration
        id: config
        uses: cuioss/cuioss-organization/.github/actions/read-project-config@2482456e205eb618b2f09ae48800cb5ef786ad7a # v0.39.0
        with:
          caller-inputs: ${{ toJSON(inputs) }}

      # deploy-target: github-packages — nothing is published by this job, so the JDK is
      # set up without a server and without a GPG key. Resolving from the registry is
      # authenticated by the consumer's own committed settings.xml.
      - name: Set up JDK ${{ steps.config.outputs.java-version }} (no publishing)
        if: ${{ steps.config.outputs.deploy-target == 'github-packages' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ steps.config.outputs.java-version }}
          distribution: 'temurin'
          cache: maven

      # The four secrets are `required: false` so that a github-packages caller can pass none.
      # A Maven Central release needs all of them: without this check a caller that omits one
      # would get as far as release:perform before failing, with the release prepared.
      - name: Require the Maven Central publishing secrets
        if: ${{ steps.config.outputs.deploy-target != 'github-packages' }}
        env:
          HAS_OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME != '' }}
          HAS_OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD != '' }}
          HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAS_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE != '' }}
        run: |
          missing=()
          [ "$HAS_OSS_SONATYPE_USERNAME" = "true" ] || missing+=("OSS_SONATYPE_USERNAME")
          [ "$HAS_OSS_SONATYPE_PASSWORD" = "true" ] || missing+=("OSS_SONATYPE_PASSWORD")
          [ "$HAS_GPG_PRIVATE_KEY" = "true" ] || missing+=("GPG_PRIVATE_KEY")
          [ "$HAS_GPG_PASSPHRASE" = "true" ] || missing+=("GPG_PASSPHRASE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::a Maven Central release needs the secrets ${missing[*]} — pass them from the caller, or set maven-build.deploy-target: github-packages in project.yml"
            exit 1
          fi

      - name: Set up JDK ${{ steps.config.outputs.java-version }}
        if: ${{ steps.config.outputs.deploy-target != 'github-packages' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ steps.config.outputs.java-version }}
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: maven

      # Maven 3.10.0 sends a settings.xml server's credentials only to origins associated
      # with that server id, and the id `central` is associated with
      # https://repo.maven.apache.org alone. setup-java writes the server without
      # <repositoryOrigins> and has no input for it, so without this step the Sonatype
      # credentials are never sent to central.sonatype.com and the deploy fails with
      # HTTP 401 ("Not using credentials of server 'central'"). Maven 3.9.x does not know
      # the element: it logs "Unrecognised tag: 'repositoryOrigins'" and carries on.
      # Fails closed: a settings.xml without exactly one `central` server is an error,
      # not a silent no-op, because the no-op is the 401 this step exists to prevent.
      # Its `if:` is the one of the setup-java step it patches, and must stay that: the
      # step runs whenever the `central` server is written, and only then.
      - name: Declare central.sonatype.com as an origin of the central server
        if: ${{ steps.config.outputs.deploy-target != 'github-packages' }}
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          settings = Path.home() / ".m2" / "settings.xml"
          origins = (
              "  <repositoryOrigins>\n"
              "        <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>\n"
              "      </repositoryOrigins>\n"
              "    "
          )
          text = settings.read_text(encoding="utf-8")
          if "<repositoryOrigin>https://central.sonatype.com</repositoryOrigin>" in text:
              print(f"{settings} already declares https://central.sonatype.com as a repository origin")
              sys.exit(0)
          patched, count = re.subn(
              r"(<server>\s*<id>central</id>.*?)(</server>)",
              lambda match: match.group(1) + origins + match.group(2),
              text,
              flags=re.DOTALL,
          )
          if count != 1:
              sys.exit(f"::error::expected exactly one 'central' server in {settings}, found {count}")
          settings.write_text(patched, encoding="utf-8")
          print(f"Declared https://central.sonatype.com as a repository origin of server 'central' in {settings}")
          PY

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configure Git author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "cuioss-release-bot"

      # MAVEN_GITHUB_TOKEN carries the workflow token only with project.yml
      # maven-build.github-token-env: true (a build resolving from a GitHub Packages
      # registry). The preamble exports it as GITHUB_TOKEN and drops the carrier, so
      # with the key off Maven starts with exactly the environment it had before the
      # key existed — in particular not with an EMPTY GITHUB_TOKEN, which an
      # expression on GITHUB_TOKEN itself would set. See reusable-maven-build.yml.
      - name: Maven release ${{ steps.config.outputs.current-version }}
        if: ${{ steps.config.outputs.deploy-target != 'github-packages' }}
        run: |
          if [ -n "$MAVEN_GITHUB_TOKEN" ]; then export GITHUB_TOKEN="$MAVEN_GITHUB_TOKEN"; fi
          unset MAVEN_GITHUB_TOKEN
          git checkout -b release
          ./mvnw -B --no-transfer-progress -P${{ steps.config.outputs.maven-profiles-release }} release:clean release:prepare \
            -DreleaseVersion=${{ steps.config.outputs.current-version }} \
            -DdevelopmentVersion=${{ steps.config.outputs.next-version }}
          # Install SNAPSHOT artifacts to local repo for multi-module site generation
          ./mvnw -B --no-transfer-progress install -DskipTests
          ./mvnw -B --no-transfer-progress -P${{ steps.config.outputs.maven-profiles-release }} site:site site:stage
          git checkout ${{ github.ref_name }}
          git rebase release
          ./mvnw -B --no-transfer-progress -P${{ steps.config.outputs.maven-profiles-release }} release:perform -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GITHUB_TOKEN: ${{ steps.config.outputs.github-token-env == 'true' && github.token || '' }}

      # deploy-target: github-packages — the same release, without release:perform.
      # release:perform is the publish (it checks the tag out and runs `deploy`), and this
      # job's token cannot write packages (see the header of this file). So the release
      # is prepared, tagged and pushed here, and the caller's next job publishes from that
      # tag through reusable-maven-github-packages-deploy.yml. No Sonatype or GPG secret
      # reaches this step. GITHUB_TOKEN is always set: the registry the artifacts go to is
      # also the one a build of this repository resolves from, and it never answers
      # anonymously. An empty profile list yields no -P argument at all rather than a
      # bare `-P` that would swallow the next goal as a profile name. The site is built
      # only when it is going to be deployed.
      - name: Maven release ${{ steps.config.outputs.current-version }} (prepare only, published from the tag)
        if: ${{ steps.config.outputs.deploy-target == 'github-packages' }}
        run: |
          git checkout -b release
          ./mvnw -B --no-transfer-progress ${{ steps.config.outputs.maven-profiles-release != '' && format('-P{0}', steps.config.outputs.maven-profiles-release) || '' }} release:clean release:prepare \
            -DreleaseVersion=${{ steps.config.outputs.current-version }} \
            -DdevelopmentVersion=${{ steps.config.outputs.next-version }}
          if [ "${{ steps.config.outputs.deploy-site == 'true' }}" = "true" ]; then
            # Install SNAPSHOT artifacts to local repo for multi-module site generation
            ./mvnw -B --no-transfer-progress install -DskipTests
            ./mvnw -B --no-transfer-progress ${{ steps.config.outputs.maven-profiles-release != '' && format('-P{0}', steps.config.outputs.maven-profiles-release) || '' }} site:site site:stage
          fi
          git checkout ${{ github.ref_name }}
          git rebase release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy Maven Site
        if: ${{ steps.config.outputs.deploy-site == 'true' }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: target/site
          repository-name: cuioss/cuioss.github.io
          target-folder: ${{ steps.config.outputs.pages-reference }}
          branch: main
          token: ${{ steps.release-token.outputs.token }}

      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ steps.release-token.outputs.token }}
          branch: ${{ github.ref_name }}
          force: true

      - name: Push tag ${{ steps.config.outputs.current-version }}
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ steps.release-token.outputs.token }}
          branch: ${{ github.ref_name }}
          tags: true
          force: true

      - name: Create GitHub Release
        if: ${{ steps.config.outputs.create-github-release == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.release-token.outputs.token }}
          tag_name: ${{ steps.config.outputs.current-version }}
          name: ${{ steps.config.outputs.current-version }}
          generate_release_notes: true
          make_latest: true

  # Wait for the released artifact to appear on Maven Central before propagating.
  # Skipped for deploy-target: github-packages, where nothing is published to Maven
  # Central. propagate-to-consumers below runs past that skip on its own always() and
  # explicit release.result check, and says so in its summary. It then opens the
  # consumer PRs BEFORE the caller's deploy job has published the release: those PRs
  # build green only once that job has finished, and may need a re-run.
  wait-for-maven-central:
    needs: [release]
    if: >-
      success() &&
      needs.release.outputs.deploy-target != 'github-packages' &&
      needs.release.outputs.consumers != '' &&
      needs.release.outputs.dep-prop-group-id != '' &&
      needs.release.outputs.dep-prop-artifact-id != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      found: ${{ steps.wait.outputs.found }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # This ref selects which revision of workflow-scripts/ executes, so it is
      # an executed reference exactly like a `uses:` pin — do not hand-edit it
      # out of step with the `uses:` refs above. The release job's pre-tag pass
      # rewrites it to the commit being tagged, and check-internal-pinning.py
      # fails the release if it ever disagrees with its siblings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cuioss/cuioss-organization
          ref: 2482456e205eb618b2f09ae48800cb5ef786ad7a # v0.39.0
          sparse-checkout: workflow-scripts

      - name: Wait for Maven Central
        id: wait
        run: |
          python3 workflow-scripts/check-maven-central.py \
            --group-id "${{ needs.release.outputs.dep-prop-group-id }}" \
            --artifact-id "${{ needs.release.outputs.dep-prop-artifact-id }}" \
            --version "${{ needs.release.outputs.released-version }}" \
            --timeout 1800

  # Propagate the new version to consumer repositories.
  #
  # One matrix leg per consumer OWNER, because an installation token of a GitHub App is
  # valid for exactly one account: a consumer in another organisation cannot be reached
  # with the cuioss token. Each leg mints its own token — from cuioss-release-bot for
  # cuioss, from that organisation's own release App for any other owner — with `owner:`
  # set to that account, and propagates to that owner's consumers only. The
  # grouping comes from read-project-config's `consumer-matrix`, the one place the
  # `[<owner>/]<repo>[:<hint>]` syntax is parsed.
  #
  # The `release` job's own token above stays a cuioss token: pushes, tags and Pages are
  # not consumer propagation and never leave this organisation.
  propagate-to-consumers:
    name: propagate-to-consumers (${{ matrix.group.owner }})
    needs: [release, wait-for-maven-central]
    if: >-
      always() &&
      needs.release.result == 'success' &&
      needs.release.outputs.consumers != '' &&
      needs.release.outputs.dep-prop-group-id != '' &&
      needs.release.outputs.dep-prop-artifact-id != ''
    runs-on: ubuntu-latest
    # Deliberately NOT continue-on-error. The artifact is already on Maven
    # Central by the time this job runs, so the release itself is done and the
    # `release` job stays green — but a consumer that did not get its bump PR
    # is a failure someone has to see. Tolerating it here is what let
    # cui-parent 1.7.3 miss three consumers behind a green run.
    permissions:
      contents: read
    strategy:
      # One owner's failure — a missing installation, say — must not cancel the others.
      fail-fast: false
      matrix:
        # `consumers != ''` with an empty matrix is a mismatched workflow/action pair;
        # GitHub then fails the run on the empty matrix, which is the loud outcome wanted.
        group: ${{ fromJSON(needs.release.outputs.consumer-matrix || '[]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # WHICH App propagates depends on the owner. cuioss consumers are reached with
      # cuioss-release-bot (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY). Every other owner has
      # its own private release App, installed only on that account, whose credentials are
      # stored in cuioss as RELEASE_APP_ID_<OWNER> / RELEASE_APP_PRIVATE_KEY_<OWNER>
      # (plan-marshall -> ..._PLAN_MARSHALL). read-project-config derives both names and
      # carries them in the matrix; the `secrets` context is indexed by them here.
      #
      # There is NO fallback to the cuioss App: a foreign owner's names always carry the
      # suffix, and an absent secret reads as the empty string. This step turns that into
      # an explicit `missing` list, so the token step is skipped and the propagation step
      # reports every consumer of this owner by the names of the secrets it lacks.
      - name: Check release App credentials
        id: app
        env:
          APP_ID: ${{ secrets[matrix.group.app-id-secret] }}
          PRIVATE_KEY: ${{ secrets[matrix.group.private-key-secret] }}
          APP_ID_SECRET: ${{ matrix.group.app-id-secret }}
          PRIVATE_KEY_SECRET: ${{ matrix.group.private-key-secret }}
        run: |
          MISSING=""
          if [ -z "$APP_ID_SECRET" ] || [ -z "$APP_ID" ]; then
            MISSING="${APP_ID_SECRET:-<no app-id secret name in the consumer matrix>}"
          fi
          if [ -z "$PRIVATE_KEY_SECRET" ] || [ -z "$PRIVATE_KEY" ]; then
            MISSING="${MISSING:+$MISSING, }${PRIVATE_KEY_SECRET:-<no private-key secret name in the consumer matrix>}"
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ -n "$MISSING" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Scoped to that App's installation on that one owner, nothing wider. It is NOT
      # narrowed to the listed repositories, because a token request naming one repository
      # the installation cannot see is refused as a whole, and a single stale entry would
      # then cost every consumer of that owner.
      #
      # continue-on-error: a failure here — the App not installed on the owner, a wrong ID
      # or key — must become one named error row per consumer in the summary below, written
      # by the next step, and not a bare red step.
      - name: Generate Propagation Token
        id: prop-token
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets[matrix.group.app-id-secret] }}
          private-key: ${{ secrets[matrix.group.private-key-secret] }}
          owner: ${{ matrix.group.owner }}

      # This ref selects which revision of workflow-scripts/ executes, so it is
      # an executed reference exactly like a `uses:` pin — do not hand-edit it
      # out of step with the `uses:` refs above. The release job's pre-tag pass
      # rewrites it to the commit being tagged, and check-internal-pinning.py
      # fails the release if it ever disagrees with its siblings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cuioss/cuioss-organization
          ref: 2482456e205eb618b2f09ae48800cb5ef786ad7a # v0.39.0
          sparse-checkout: workflow-scripts

      # Everything that originates in project.yml reaches the shell through `env:` and jq,
      # never by interpolation into the script.
      - name: Update consumer repos
        id: update-consumers
        env:
          GH_TOKEN: ${{ steps.prop-token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.prop-token.outcome }}
          CREDENTIALS_MISSING: ${{ steps.app.outputs.missing }}
          APP_ID_SECRET: ${{ matrix.group.app-id-secret }}
          PRIVATE_KEY_SECRET: ${{ matrix.group.private-key-secret }}
          OWNER: ${{ matrix.group.owner }}
          CONSUMERS_JSON: ${{ toJSON(matrix.group.consumers) }}
          VERSION: ${{ needs.release.outputs.released-version }}
          GROUP_ID: ${{ needs.release.outputs.dep-prop-group-id }}
          ARTIFACT_ID: ${{ needs.release.outputs.dep-prop-artifact-id }}
          SCOPE: ${{ needs.release.outputs.dep-prop-scope }}
          MAVEN_CENTRAL_FOUND: ${{ needs.wait-for-maven-central.outputs.found }}
          DEPLOY_TARGET: ${{ needs.release.outputs.deploy-target }}
        run: |
          # Collect results for summary
          RESULTS_FILE=$(mktemp)
          echo "RESULTS_FILE=$RESULTS_FILE" >> "$GITHUB_OUTPUT"
          echo "[]" > "$RESULTS_FILE"

          PROPAGATION_FAILED=0

          record_result() {
            jq --arg repo "$1" --argjson result "$2" \
              '. += [{"repo": $repo} + $result]' "$RESULTS_FILE" > "${RESULTS_FILE}.tmp" \
              && mv "${RESULTS_FILE}.tmp" "$RESULTS_FILE"
          }

          while IFS= read -r CONSUMER; do
            ENTRY=$(jq -r '.entry' <<<"$CONSUMER")
            REPO=$(jq -r '.repo' <<<"$CONSUMER")
            ENTRY_ERROR=$(jq -r '.error // ""' <<<"$CONSUMER")

            # A malformed entry has no repository to propagate to. It is reported, and
            # fails the job: dropping it would leave that consumer silently unpropagated.
            if [ -n "$ENTRY_ERROR" ]; then
              echo "::error::consumer entry '$ENTRY': $ENTRY_ERROR"
              record_result "$ENTRY" "$(jq -nc --arg error "$ENTRY_ERROR" '{status: "error", error: $error}')"
              PROPAGATION_FAILED=1
              continue
            fi

            # No credentials for this owner's release App. Named by the secrets, because
            # that is what has to be created; never answered by borrowing another owner's App.
            if [ -n "$CREDENTIALS_MISSING" ]; then
              REASON="no release App credentials for '$OWNER': consumers of that owner need the secrets $APP_ID_SECRET and $PRIVATE_KEY_SECRET; missing or empty: $CREDENTIALS_MISSING"
              echo "::error::$OWNER/$REPO: $REASON"
              record_result "$OWNER/$REPO" "$(jq -nc --arg error "$REASON" '{status: "error", error: $error}')"
              PROPAGATION_FAILED=1
              continue
            fi

            # The credentials exist but yielded no token: the App they belong to is not
            # installed on this owner, or the ID and key do not match. The token step's log
            # has the API answer.
            if [ "$TOKEN_OUTCOME" != "success" ] || [ -z "$GH_TOKEN" ]; then
              REASON="no installation token for '$OWNER': the release App from $APP_ID_SECRET / $PRIVATE_KEY_SECRET is not installed on that account with access to $REPO, or its ID and private key do not match"
              echo "::error::$OWNER/$REPO: $REASON"
              record_result "$OWNER/$REPO" "$(jq -nc --arg error "$REASON" '{status: "error", error: $error}')"
              PROPAGATION_FAILED=1
              continue
            fi

            # The optional per-consumer hint, already split off by read-project-config.
            # What the hint means depends on the scope, because that is where the
            # version lives in that consumer:
            #   scope=dependency -> the version property name
            #   scope=parent     -> the parent artifactId this consumer inherits,
            #                       for one on a different parent of the same reactor
            #                       (e.g. cui-quarkus-parent rather than cui-java-parent).
            # Without the parent form the matcher, which is an exact artifactId match,
            # silently skips such a consumer on every release and reports it as
            # "no changes needed" rather than as a miss.
            HINT=$(jq -r '.hint' <<<"$CONSUMER")

            EXTRA_ARGS=()
            if [ -n "$HINT" ]; then
              if [ "$SCOPE" = "parent" ]; then
                echo "::group::Propagating to $OWNER/$REPO (parent: $HINT)"
                EXTRA_ARGS=(--parent-artifact-id "$HINT")
              else
                echo "::group::Propagating to $OWNER/$REPO (property: $HINT)"
                EXTRA_ARGS=(--version-property "$HINT")
              fi
            else
              echo "::group::Propagating to $OWNER/$REPO"
            fi
            OUTPUT=$(python3 workflow-scripts/update-consumer-dependency.py \
              --org "$OWNER" \
              --repo "$REPO" \
              --group-id "$GROUP_ID" \
              --artifact-id "$ARTIFACT_ID" \
              --new-version "$VERSION" \
              --scope "$SCOPE" \
              "${EXTRA_ARGS[@]}" 2>&1) || true
            echo "$OUTPUT"

            # Extract RESULT JSON line
            RESULT_LINE=$(echo "$OUTPUT" | grep '^RESULT:' | sed 's/^RESULT://')
            if [ -z "$RESULT_LINE" ]; then
              # The script died before emitting a result — a crash, a rejected
              # argument, a network error. Skipping it silently drops the repo
              # from the table below and leaves this job green: that is exactly
              # how cui-parent 1.7.3 reached 14 consumers and silently missed
              # the three that pass --parent-artifact-id. Record it as an error
              # row and fail the step once the summary has been written.
              REASON=$(echo "$OUTPUT" | tail -n 3 | tr '\n|' '  ')
              RESULT_LINE=$(jq -nc --arg error "${REASON:-no output}" \
                '{status: "no_result", error: $error}')
              PROPAGATION_FAILED=1
            fi

            record_result "$OWNER/$REPO" "$RESULT_LINE"
            echo "::endgroup::"
          done < <(jq -c '.[]' <<<"$CONSUMERS_JSON")

          # Build propagation summary
          {
            echo "## Dependency Propagation Summary: $OWNER"
            echo ""
            echo "**Artifact:** \`${GROUP_ID}:${ARTIFACT_ID}:${VERSION}\`"
            echo "**Scope:** ${SCOPE}"
            echo ""
            if [ "$DEPLOY_TARGET" = "github-packages" ]; then
              echo ":information_source: Published to GitHub Packages by the caller's deploy job, which runs after this workflow — the artifact may not be resolvable yet when these PRs open"
            elif [ "$MAVEN_CENTRAL_FOUND" = "true" ]; then
              echo ":white_check_mark: Artifact confirmed on Maven Central before propagation"
            elif [ "$MAVEN_CENTRAL_FOUND" = "false" ]; then
              echo ":warning: Artifact NOT confirmed on Maven Central (timeout) — PRs created anyway"
            else
              echo ":grey_question: Maven Central wait status unknown"
            fi
            echo ""

            echo "### Consumer Repository Updates"
            echo ""
            echo "| Repository | Status | PR |"
            echo "|---|---|---|"

            jq -r '.[] |
              if .status == "pr_auto_merge_enabled" then
                "| " + .repo + " | :hourglass: Auto-merge enabled | [PR](" + (.pr_url // "-") + ") |"
              elif .status == "pr_auto_merge_failed" then
                "| " + .repo + " | :x: Auto-merge FAILED (needs manual merge) | [PR](" + (.pr_url // "-") + ") |"
              elif .status == "pr_created" then
                "| " + .repo + " | :arrow_right: PR Created | [PR](" + (.pr_url // "-") + ") |"
              elif .status == "no_changes" then
                "| " + .repo + " | :heavy_minus_sign: No Changes | - |"
              elif .status == "no_result" then
                "| " + .repo + " | :x: FAILED - no result from script | " + (.error // "unknown") + " |"
              else
                "| " + .repo + " | :x: Error | " + (.error // "unknown") + " |"
              end' "$RESULTS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PROPAGATION_FAILED" = "1" ]; then
            echo "::error::At least one consumer of $OWNER was not propagated to - see the propagation summary"
            exit 1
          fi

      # always(): a propagation failure above must not hide the fate of the PRs
      # that were created before it.
      - name: Verify consumer PR merges
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.prop-token.outputs.token }}
          RESULTS_FILE: ${{ steps.update-consumers.outputs.RESULTS_FILE }}
        run: |
          if [ -n "$RESULTS_FILE" ] && [ -f "$RESULTS_FILE" ]; then
            python3 workflow-scripts/verify-consumer-prs.py \
              --results-file "$RESULTS_FILE" \
              --timeout 900
            rm -f "$RESULTS_FILE"
          else
            echo "No results file found, skipping verification"
          fi
