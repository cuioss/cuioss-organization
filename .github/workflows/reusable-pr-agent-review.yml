name: PR Agent Review (Reusable)
# Third automated PR reviewer for the cuioss org, beside CodeRabbit and Sourcery.
# Runs the open-source PR-Agent (The-PR-Agent/pr-agent) on Google Gemini via Vertex AI,
# authenticated keylessly through Workload Identity Federation — no Google credential is
# stored in GitHub. Vertex also draws on the GCP free-trial credits, which AI Studio does not.
#
# Tuning lives centrally in cuioss/pr-agent-settings (.pr_agent.toml) — NOT here. Model and
# tool tuning must never be set in this workflow's `env:`, because environment variables are
# the highest-precedence configuration source and would silently decentralize them.
#
# What DOES live here, by necessity: the org skip rules. PR-Agent's ignore_pr_labels /
# ignore_pr_authors / ignore_pr_title settings are read only by its webhook servers
# (should_process_pr_logic) and are ignored entirely in GitHub Action mode, so they are
# enforced as the job-level `if:` guard below. See cuioss/pr-agent-settings/README.adoc.

on:
  workflow_call:
    inputs:
      auto-review:
        description: 'Run /review automatically on a new pull request.'
        required: false
        type: boolean
        default: true
      auto-describe:
        description: >-
          Run /describe automatically. Off by default: it rewrites the pull request
          description, which collides with generated PR bodies and the machine-readable
          blocks our automation reads out of them.
        required: false
        type: boolean
        default: false
      auto-improve:
        description: >-
          Run /improve automatically. Off by default: committable suggestions are already
          CodeRabbit's job, so enabling this duplicates findings and roughly doubles the
          token cost per pull request.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Hard cap for the reviewer job.'
        required: false
        type: number
        default: 15
    secrets:
      REVIEW_APP_ID:
        description: 'cuioss-review-bot GitHub App ID (organization-level).'
        required: true
      REVIEW_APP_PRIVATE_KEY:
        description: 'cuioss-review-bot private key (organization-level).'
        required: true
      # These two are the ONLY secrets this workflow takes. Gemini is reached through Vertex AI
      # with Workload Identity Federation, so there is no Google credential to store.

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Mint the OIDC token that Workload Identity Federation exchanges for GCP credentials. This
  # is what makes the Vertex AI path keyless — no Google credential is stored in GitHub.
  id-token: write

# The unit of grouping is the TRIGGER, not the pull request — and nothing is ever cancelled.
#
# Both properties are here because the obvious shape (one group per PR, cancel-in-progress: true)
# was live and actively destructive. Concurrency is evaluated at WORKFLOW level, before the job's
# `if:` guard, so every comment on a pull request claimed the group and cancelled whatever was
# running — including comments the guard then skipped. Two observed failures on one pull request:
# a maintainer's /review was killed four seconds later by an unrelated "@coderabbitai review"
# comment (and so silently did nothing), and the run that DID publish a review cancelled ITSELF,
# because its own review comment fired issue_comment three seconds after it posted.
#
# That self-cancellation is worse than a wasted run: the reviewer step had already succeeded and
# published, but the fail-closed gate at the end of this job was skipped, so a review reached the
# pull request while the step that verifies the reviewer actually worked never ran. A workflow
# whose reason for existing is a truthful signal must not be able to cancel its own verification.
#
#   - Comment runs are keyed per COMMENT: each is a distinct, explicit human request (/review is
#     not /ask), so they must not collapse into one group. Dropping one because another arrived
#     is never right.
#   - pull_request runs are keyed per PR: opened/reopened/ready_for_review are redundant
#     notifications about the same state, so grouping them is correct.
#   - cancel-in-progress stays FALSE, matching the org-wide policy in docs/Workflows.adoc
#     ("we intentionally do not use workflow-level concurrency with cancel-in-progress").
#
# The accepted cost is that two reviews requested seconds apart can run concurrently and both
# update the persistent review comment, last write winning. That is strictly better than silently
# discarding a maintainer's explicit request.
#
# The group expression is deliberately kept on ONE line: a folded YAML scalar preserves the line
# breaks of more-indented continuation lines, which would embed newlines inside the ${{ }} it is
# supposed to be evaluating.
concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  review:
    # THE ORG SKIP RULES — the parity surface with cuioss/coderabbit's .coderabbit.yaml.
    #
    # pull_request branch:
    #   - dependabot[bot]         dependency bumps, already gated by CI and auto-merge
    #   - cuioss-release-bot[bot] consumer-propagation and workflow-SHA bumps
    #   - skip-bot-review label   the shared org-wide manual opt-out
    #   - fork pull requests      secrets are unavailable to them, so the token step could
    #                             only fail; skipping keeps external PRs clean. Reviewing
    #                             forks needs pull_request_target and a separate security
    #                             review of that decision.
    # issue_comment branch: an explicit slash-command on a pull request. This path is
    # PRIVILEGED — unlike `pull_request`, an `issue_comment` event always runs in the base-repo
    # context with full access to secrets and the OIDC token, even when the pull request comes
    # from a fork. So the gate here is on WHO may trigger it, not on which pull request:
    #
    #   - author_association restricts triggering to OWNER / MEMBER / COLLABORATOR. This is
    #     what keeps an outside contributor from spending our Vertex budget, or steering a run
    #     that holds a PR-write App token, by commenting on their own fork's pull request.
    #     It also subsumes the fork case the pull_request branch handles structurally.
    #   - sender.type != 'Bot' keeps the reviewer from retriggering itself off its own comment.
    #   - The commands are matched individually rather than by a bare leading "/", so an
    #     unrelated slash-prefixed comment cannot start a runner.
    #
    # The org PR skips are deliberately NOT mirrored here. A trusted maintainer typing /review
    # on a dependabot pull request, or on one labelled skip-bot-review, is asking on purpose —
    # an explicit human request outranks a blanket automation skip. That override is safe only
    # because of the author_association gate above; without it, the skips would be bypassable
    # by anyone who can comment.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'cuioss-release-bot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'skip-bot-review')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.sender.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/improve') ||
          startsWith(github.event.comment.body, '/describe') ||
          startsWith(github.event.comment.body, '/ask') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The reviewer posts under its own identity rather than github-actions[bot], so that
      # downstream review-ingestion can attribute findings to it. `repositories` MUST include
      # pr-agent-settings: without read access to it PR-Agent skips the central configuration
      # silently, with no error in the log.
      #
      # `owner: cuioss` is deliberately fixed, not derived from github.repository: the App
      # installation and the pr-agent-settings repo are both organization-scoped, so this
      # workflow is only callable from cuioss repositories. (The repository NAME is dynamic,
      # so a renamed repo needs no change here.)
      - name: Generate Review Token
        id: review-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},pr-agent-settings
          owner: cuioss

      # Keyless GCP auth: the job's OIDC token is exchanged for short-lived credentials for the
      # reviewer service account. Nothing Google-side is stored in GitHub secrets — the pool,
      # provider and service account are org variables, not credentials.
      #
      # The action writes the credentials file into $GITHUB_WORKSPACE precisely so Docker-based
      # actions can read it (see the path translation below). No checkout is needed for that.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_REVIEW_SERVICE_ACCOUNT }}

      # TWO container boundaries have to be crossed by hand here, and getting either wrong
      # produces an auth failure inside the reviewer that looks like nothing at all:
      #
      #   1. PATH — the action reports a HOST path
      #      (/home/runner/work/{repo}/{repo}/gha-creds-*.json), but the reviewer is a Docker
      #      action with the workspace mounted at /github/workspace. The host path does not
      #      resolve inside the container, so only the basename is reusable.
      #   2. ENV — a Docker action receives ONLY the variables named in its own `env:` block
      #      (plus the standard GITHUB_*/RUNNER_* set). Exporting GOOGLE_APPLICATION_CREDENTIALS
      #      to $GITHUB_ENV, as the auth action does, does NOT forward it into the container.
      #      It has to be restated on the reviewer step below.
      - name: Resolve credentials path inside the reviewer container
        id: gcp-creds
        env:
          HOST_PATH: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ -z "$HOST_PATH" ]]; then
            echo "::error::google-github-actions/auth produced no credentials file path"
            exit 1
          fi
          # Fail early and by name. Without it the reviewer would reach the model call with no
          # vertex_project, and the only symptom would be a review that never appears.
          if [[ -z "$PROJECT_ID" ]]; then
            echo "::error::organization variable GCP_PROJECT_ID is not set — the Vertex AI project is unknown"
            exit 1
          fi
          echo "in_container=/github/workspace/$(basename "$HOST_PATH")" >> "$GITHUB_OUTPUT"

      # Timestamp taken BEFORE the reviewer runs, so the published-review gate below can tell
      # a review this run produced from a stale one left by an earlier run (the review comment
      # is persistent and updated in place, so mere existence proves nothing).
      - name: Record run start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Pinned by IMAGE DIGEST, not by action ref. The action's Dockerfile is a bare
      # `FROM pragent/pr-agent:github_action` — a floating tag in the former vendor's Docker
      # Hub namespace — so pinning `The-PR-Agent/pr-agent@<sha>` would pin the wrapper while
      # the executed code kept moving. Bump this digest deliberately, as a reviewed change.
      # (Digest for the image published alongside upstream v0.39.0.)
      - name: Review pull request
        id: review
        uses: docker://pragent/pr-agent@sha256:b253845caa8c7ff5ce8be78f32996647982bdd4890826a962b78eff2e385a825
        env:
          GITHUB_TOKEN: ${{ steps.review-token.outputs.token }}
          # Vertex AI credentials, translated to the in-container path (see above). LiteLLM
          # picks these up as Application Default Credentials.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-creds.outputs.in_container }}
          # Dotted keys are PR-Agent's documented env form; double underscores
          # (VERTEXAI__VERTEX_PROJECT) are the documented equivalent. pr-agent reads these in
          # litellm_ai_handler.py and hands them to LiteLLM as vertex_project / vertex_location.
          #
          # These two are deployment IDENTITY, not review tuning, so they are org variables
          # rather than entries in the public pr-agent-settings repo — one place to change, and
          # the GCP project id stays out of a public config file. Everything that IS review
          # tuning (model, fallbacks, charter, noise toggles) remains central there.
          VERTEXAI.VERTEX_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          VERTEXAI.VERTEX_LOCATION: ${{ vars.GCP_VERTEX_LOCATION || 'global' }}
          # No GOOGLE_AI_STUDIO.GEMINI_API_KEY here, deliberately. Carrying it "just in case"
          # advertised an AI Studio fallback that does not exist — the org secret is gone, so
          # the value would resolve to an empty string and a `gemini/…` model id in
          # pr-agent-settings would fail at the model call. Restoring that path means
          # re-creating the secret AND re-adding this line; leaving a dead reference here would
          # only hide that.
          # The three tool toggles are the one deliberate exception to central configuration:
          # they are caller inputs, so a single repository can opt into /improve without
          # editing the org-wide file. Everything else comes from cuioss/pr-agent-settings.
          github_action_config.auto_review: ${{ inputs.auto-review }}
          github_action_config.auto_describe: ${{ inputs.auto-describe }}
          github_action_config.auto_improve: ${{ inputs.auto-improve }}

      # FAIL-CLOSED GATE — the reviewer step above CANNOT be trusted to report its own failure.
      # PR-Agent's action runner catches its own exceptions, logs them at WARNING/ERROR, and
      # still exits 0: a run whose every model call failed (wrong model id, no entitlement to
      # the model, exhausted credits, provider outage) reports SUCCESS. That is a false green in
      # the one signal this workflow exists to produce.
      #
      # The oracle is the step's own structured output, NOT a published comment. pr_reviewer.py
      # calls github_action_output(data, 'review') from _prepare_pr_review(), which runs BEFORE
      # the publish decision — so `steps.review.outputs.review` is written whenever the model
      # produced a review, and is absent whenever every model call failed.
      #
      # Gating on the comment instead would be WRONG in both directions: a clean review
      # publishes nothing under pr_reviewer.publish_output_no_suggestions = false (our setting,
      # to suppress "No major issues detected" noise), and the review comment is persistent and
      # updated in place, so a stale one from an earlier run would satisfy a naive check.
      #
      # Scoped to auto-review pull_request runs: a comment-triggered /ask or /help writes no
      # review output, and auto-review: false produces none by definition.
      - name: Verify the reviewer actually produced a review
        if: ${{ github.event_name == 'pull_request' && inputs.auto-review }}
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.review }}
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          if [[ -z "$REVIEW_OUTPUT" ]]; then
            echo "::error::PR-Agent produced no review for this run. Its action exits 0 even when every model call fails — read the 'Review pull request' step log for the real cause (look for 'Error during LLM inference' / 'Failed to generate prediction with any model')."
            exit 1
          fi
          echo "Reviewer produced a review: ${REVIEW_OUTPUT}"
          # Informational only. A review with no findings is deliberately not published, so the
          # absence of a comment is a legitimate outcome and must never fail the job.
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate > comments.json
          fresh="$(jq --arg since "$STARTED_AT" '
            [ .[]
              | select(.user.login | startswith("cuioss-review-bot"))
              | select(.body | startswith("## PR Reviewer Guide"))
              | select(.updated_at >= $since)
            ] | length' comments.json)"
          if [[ "${fresh:-0}" -ge 1 ]]; then
            echo "Published as a review comment on the pull request."
          else
            echo "Nothing published — the review carried no findings worth a comment."
          fi
