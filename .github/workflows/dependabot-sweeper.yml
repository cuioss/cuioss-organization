name: Dependabot Sweeper

# Merges the Dependabot PRs that reusable-dependabot-auto-merge.yml labelled as
# eligible, across every repository of every owner that consumes these workflows (cuioss
# and plan-marshall), one matrix leg per owner.
#
# This runs here rather than in each consumer repo on purpose: a Dependabot-
# triggered workflow only ever holds GITHUB_TOKEN, cannot read Actions secrets,
# and -- because GitHub starts no workflow runs for GITHUB_TOKEN events -- cannot
# land a PR through a required merge queue. A scheduled run in this repository is
# not Dependabot-triggered, so it can mint a cuioss-release-bot App token and
# merge as an identity whose events do start the merge_group check runs.

on:
  schedule:
    # Every 15 minutes -- the upper bound on how long an eligible, green
    # Dependabot PR waits before it is enqueued.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report what would be merged without merging'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: dependabot-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Below the 15-minute cron period: a stuck run is killed before the next
    # one is due, so runs can never stack up behind it under
    # cancel-in-progress: false.
    timeout-minutes: 10
    # One leg per owner: a release App is installed on one account only, so one token cannot
    # reach both. fail-fast is off so that a broken owner never stops the others from being swept.
    strategy:
      fail-fast: false
      matrix:
        owner:
          # cuioss-release-bot
          - name: cuioss
            app-id-secret: RELEASE_APP_ID
            private-key-secret: RELEASE_APP_PRIVATE_KEY
          # The private release App of the plan-marshall organisation. The secret names are the
          # ones release.yml derives for a foreign owner (RELEASE_APP_ID_<OWNER>); without them
          # in this repository the leg reports it and does nothing, it does not fail.
          - name: plan-marshall
            app-id-secret: RELEASE_APP_ID_PLAN_MARSHALL
            private-key-secret: RELEASE_APP_PRIVATE_KEY_PLAN_MARSHALL

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check release App credentials for ${{ matrix.owner.name }}
        id: app
        env:
          APP_ID: ${{ secrets[matrix.owner.app-id-secret] }}
          PRIVATE_KEY: ${{ secrets[matrix.owner.private-key-secret] }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release App credentials for ${{ matrix.owner.name }} (${{ matrix.owner.app-id-secret }} / ${{ matrix.owner.private-key-secret }}); its Dependabot PRs are not swept"
          fi

      - name: Generate Release Token
        id: release-token
        if: steps.app.outputs.present == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets[matrix.owner.app-id-secret] }}
          private-key: ${{ secrets[matrix.owner.private-key-secret] }}
          owner: ${{ matrix.owner.name }}

      - name: Checkout repository
        if: steps.app.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sweep labelled Dependabot PRs of ${{ matrix.owner.name }}
        if: steps.app.outputs.present == 'true'
        run: python3 workflow-scripts/sweep-dependabot-prs.py --owner "${{ matrix.owner.name }}" ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
