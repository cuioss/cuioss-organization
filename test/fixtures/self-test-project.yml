# Fixture for .github/workflows/action-self-test.yml — NOT a real project config.
#
# Exercises read-project-config against the working-tree script in a real Actions
# runtime. Deliberately sets SOME pyprojectx keys and omits others, so the
# self-test can assert every tier of the resolution:
#   - a key set here must reach the output, and beat a caller input
#   - a key omitted here must take the caller input when one is passed, else
#     the registry default
#
# Keep `verify-args`, `pre-verify-args` and `cache-dependency-glob` UNSET — the
# self-test asserts they resolve from the caller input / the default.
name: self-test-fixture

# GitHub Packages mode: deploy-target and the server id are SET, sign-artifacts is
# deliberately UNSET — the self-test asserts its default flips to false with this target.
# github-token-env is UNSET too and must resolve to its default.
maven-build:
  deploy-target: github-packages
  packages-server-id: self-test-org

pyprojectx:
  python-version: "3.12"
  verify-goals: quality-gate module-tests
  pre-verify-goals: generate

# One bare and one owner-qualified consumer, so the self-test can assert that the
# `consumer-matrix` output materializes and groups them by owner.
consumers:
  - cui-http
  - plan-marshall/plan-marshall-mcp:cui-quarkus-parent
